<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/dmsans.css">
<link rel="stylesheet" href="../../assets/fonts/tajawal.css">
<style>html,body{margin:0;background:#000}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="story1.js"></script>
<script src="story2-min.js"></script>
<script>window.DURATION_OVERRIDE = 6.0;</script>
<script>
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const json = src => fetch(src).then(r => r.json());
const ctx = document.getElementById('c').getContext('2d');
setLang(new URLSearchParams(location.search).get('lang') || 'ar');
window.FPS = FPS; window.DURATION = window.DURATION_OVERRIDE || DURATION;
function noise(seed) {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960; const g = c.getContext('2d'), d = g.createImageData(540, 960);
  let s = seed; for (let i = 0; i < d.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const v = 128 + ((s >>> 24) - 128) * 0.9; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
}
window.ready = (async () => {
  await Promise.all(['500 50px', '700 38px', '800 118px'].flatMap(f => [document.fonts.load(f + ' "DM Sans"'), document.fonts.load(f + ' "Tajawal"', 'دوّر')]));
  const uae = await json('../coffeeguessr/uae.json'), dots = (await json('../coffeeguessr/data.json')).dots;
  makeProjection(uae); preparePins(dots);
  window.A = { uae, mark: await img('../../assets/logos/mark-cream.png'), markGreen: await img('../../assets/logos/mark-green.png'), grain: [noise(1), noise(2), noise(3)] };
  for (const t of [0, 3, 6.9]) renderFrame(ctx, t, window.A);
})();
window.frame = t => { renderFrame(ctx, t, window.A); return document.getElementById('c').toDataURL('image/png'); };
</script>
