<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/tajawal.css">
<link rel="stylesheet" href="../../assets/fonts/playfair.css">
<style>html,body{margin:0;background:#000}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timing.js"></script>
<script>
// Five near-still macro shots of cold drinks, each on a slow push with a little drift, hard cuts, a thin centred name
// (Arabic over small letter-spaced serif caps, as in the reference). The last shot holds while the name gives way to
// the question; then the frame washes into BrewMaps green for the card.
const CREAM = '#F4EFE6', GREEN = 'rgba(16,36,18,0.95)', PALE = '#A9D19A';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = u => u * u * (3 - 2 * u), mix = (a, b, u) => a + (b - a) * u;
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const ctx = document.getElementById('c').getContext('2d');
let A = {};
window.DURATION = T.end;
window.ready = (async () => {
  await Promise.all([document.fonts.load('400 64px "Tajawal"', 'آيس'), document.fonts.load('800 80px "Tajawal"', 'ذوقك'), document.fonts.load('500 30px "Playfair Display"', 'ICED')]);
  A.plates = await Promise.all(SHOTS.map(s => img(s.plate)));
  A.lockup = await img('../find-rate-earn-carousel/img/lockup-cream.png');
})();

function shotAt(t) {                                       // which plate is up, and how far into its own time it is
  const i = Math.min(SHOTS.length - 1, Math.floor(t / SHOT));
  return { i, u: i === SHOTS.length - 1 ? (t - i * SHOT) / (T.card + 1 - i * SHOT) : (t - i * SHOT) / SHOT };
}
function drawPlate(i, u) {                                  // slow push: 1.00 → 1.07, with a little drift, never stopping
  const s = SHOTS[i], z = 1.0 + 0.075 * u, dx = s.drift[0] * 26 * u, dy = s.drift[1] * 26 * u;
  ctx.save(); ctx.translate(540 + dx, 960 + dy); ctx.scale(z, z); ctx.translate(-540, -960);
  ctx.drawImage(A.plates[i], 0, 0, 1080, 1920); ctx.restore();
  const g = ctx.createRadialGradient(540, 960, 300, 540, 960, 1150);                         // a soft vignette, for the thin type
  g.addColorStop(0, 'rgba(0,0,0,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
}
function name(i, a) {                                       // thin, centred: the Arabic name over small spaced serif caps
  if (a <= 0) return;
  const s = SHOTS[i];
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 16;
  ctx.direction = 'rtl'; ctx.fillStyle = CREAM; ctx.font = '400 66px "Tajawal"'; ctx.fillText(s.ar, 540, 952);
  ctx.direction = 'ltr'; ctx.fillStyle = 'rgba(244,239,230,0.78)'; ctx.font = '500 27px "Playfair Display"';
  const sp = 0.42 * 27, w = ctx.measureText(s.en).width + sp * (s.en.length - 1); let x = 540 - w / 2;   // letter-spaced by hand
  ctx.textAlign = 'left'; for (const ch of s.en) { ctx.fillText(ch, x, 1012); x += ctx.measureText(ch).width + sp; }
  ctx.restore();
}
window.frame = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1080, 1920);
  const { i, u } = shotAt(t);
  drawPlate(i, u);
  const inShot = t - i * SHOT;
  if (t < T.question) name(i, seg(inShot, 0.06, 0.28));
  else name(i, 1 - seg(t, T.question, T.question + 0.3));
  // the question, over the last shot
  const q = seg(t, T.question + 0.35, T.question + 0.8) * (1 - seg(t, T.card + 0.2, T.card + 0.7));
  if (q > 0) {
    ctx.save(); ctx.globalAlpha = q; ctx.direction = 'rtl'; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 20;
    ctx.fillStyle = CREAM; ctx.font = '800 92px "Tajawal"'; ctx.fillText('أي واحد على ذوقك؟', 540, 985);
    ctx.restore();
  }
  // the card: wash into BrewMaps green; the drink stays faintly behind
  const w = ease(seg(t, T.card, T.card + 0.9));
  if (w > 0) {
    ctx.fillStyle = `rgba(16,36,18,${0.95 * w})`; ctx.fillRect(0, 0, 1080, 1920);
    const e = ease(seg(t, T.card + 0.5, T.card + 1.0)), l = ease(seg(t, T.card + 0.8, T.card + 1.3));
    ctx.save(); ctx.globalAlpha = e;
    const L = A.lockup, lw = 440, lh = lw * L.height / L.width; ctx.drawImage(L, (1080 - lw) / 2, 640, lw, lh);
    ctx.direction = 'rtl'; ctx.textAlign = 'center';
    ctx.fillStyle = CREAM; ctx.font = '800 78px "Tajawal"'; ctx.fillText('يلقى لك الكوفي', 540, 950);
    ctx.fillStyle = PALE; ctx.fillText('اللي على ذوقك.', 540, 1050);
    ctx.globalAlpha = l; ctx.fillStyle = 'rgba(244,239,230,0.7)'; ctx.font = '500 36px "Tajawal"'; ctx.fillText('مجاني على الآب ستور وجوجل بلاي', 540, 1180);
    ctx.restore();
  }
  return document.getElementById('c').toDataURL('image/png');
};
</script>
