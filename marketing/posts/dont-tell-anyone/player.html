<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/dmsans.css">
<link rel="stylesheet" href="../../assets/fonts/tajawal.css">
<style>html,body{margin:0;background:#000}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="notes.js"></script>
<script>
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const ctx = document.getElementById('c').getContext('2d');
setLang(new URLSearchParams(location.search).get('lang') || 'ar');
window.FPS = FPS;
window.ready = (async () => {
  await Promise.all(['500 40px', '700 80px'].flatMap(f => [document.fonts.load(f + ' "DM Sans"'), document.fonts.load(f + ' "Tajawal"', 'كوفي')]));
  const data = await fetch('data.json').then(r => r.json());
  build(data); window.DURATION = DURATION;
  window.A = { data, mark: await img('../../assets/logos/mark-cream.png'), photos: await Promise.all(data.cafes.map(c => img(c.photo))) };
  for (const t of [0, 5, 12]) renderFrame(ctx, t, window.A);          // warm-up: fonts and emoji settle before frame one
})();
window.frame = t => { renderFrame(ctx, t, window.A); return document.getElementById('c').toDataURL('image/png'); };
</script>
