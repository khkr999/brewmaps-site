<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/tajawal.css">
<link rel="stylesheet" href="../../assets/fonts/playfair.css">
<style>html,body{margin:0;background:#000}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Feature story: the Map. "أكثر من ٤٠٠ كوفي مختص على خريطة وحدة" (the app's own Browse screen reads 29 areas · 413 cafés).
// Deep forest ground with a faint street grid, a typographic hero, the real app map crop (appmap.png, Dubai Marina, no café
// names) as a card, and the free-download line. Everything inside the story safe zone (y 250–1600). No emojis.
const CREAM = '#F4EFE6', PALE = '#A9D19A';
const img = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
window.ready = (async () => {
  await Promise.all([document.fonts.load('600 290px "Playfair Display"', '400'), document.fonts.load('800 66px "Tajawal"', 'كوفي'), document.fonts.load('500 40px "Tajawal"', 'أكثر'), document.fonts.load('400 32px "Tajawal"', 'مجاني BrewMaps')]);
  const map = await img('appmap.png'), lock = await img('../find-rate-earn-carousel/img/lockup-cream.png');
  const c = document.getElementById('c').getContext('2d');
  // ground: deep forest, lighter toward the map
  let g = c.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#0B1A0C'); g.addColorStop(0.55, '#123016'); g.addColorStop(1, '#0B1A0C');
  c.fillStyle = g; c.fillRect(0, 0, 1080, 1920);
  // a faint street grid, like the ground under a map
  c.save(); c.strokeStyle = 'rgba(244,239,230,0.045)'; c.lineWidth = 2;
  for (let x = -200; x < 1300; x += 118) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 140, 1920); c.stroke(); }
  for (let y = 60; y < 1920; y += 132) { c.beginPath(); c.moveTo(0, y); c.lineTo(1080, y - 90); c.stroke(); }
  c.strokeStyle = 'rgba(169,209,154,0.07)'; c.lineWidth = 6; c.beginPath(); c.moveTo(-40, 1480); c.bezierCurveTo(300, 1300, 700, 1700, 1120, 1380); c.stroke();
  c.restore();
  const lw = 280, lh = lw * lock.height / lock.width; c.drawImage(lock, (1080 - lw) / 2, 280, lw, lh);
  const ar = (t, y, size, w, col) => { c.direction = 'rtl'; c.textAlign = 'center'; c.fillStyle = col; c.font = `${w} ${size}px "Tajawal"`; c.fillText(t, 540, y); };
  ar('أكثر من', 425, 44, 500, PALE);
  c.save(); c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 30; c.direction = 'ltr'; c.textAlign = 'center'; c.fillStyle = CREAM; c.font = '600 290px "Playfair Display"'; c.fillText('400', 540, 655); c.restore();
  ar('كوفي مختص', 790, 66, 800, CREAM);
  ar('على خريطة وحدة', 872, 66, 800, PALE);
  // the map card: the real app map, unaltered, with a thin cream edge and a soft shadow
  const mw = 920, mh = Math.round(mw * map.height / map.width), mx = (1080 - mw) / 2, my = 945, r = 44;
  c.save(); c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 60; c.shadowOffsetY = 24; c.fillStyle = '#000';
  c.beginPath(); c.roundRect(mx, my, mw, mh, r); c.fill(); c.restore();
  c.save(); c.beginPath(); c.roundRect(mx, my, mw, mh, r); c.clip(); c.imageSmoothingQuality = 'high'; c.drawImage(map, mx, my, mw, mh); c.restore();
  c.save(); c.strokeStyle = 'rgba(244,239,230,0.85)'; c.lineWidth = 3; c.beginPath(); c.roundRect(mx, my, mw, mh, r); c.stroke(); c.restore();
  ar('افتح الخريطة، وشوف وش قريب منك', my + mh + 80, 40, 500, 'rgba(244,239,230,0.88)');
  ar('BrewMaps مجاني على الآب ستور وجوجل بلاي', my + mh + 135, 32, 400, 'rgba(244,239,230,0.6)');
})();
window.png = () => document.getElementById('c').toDataURL('image/png');
</script>
