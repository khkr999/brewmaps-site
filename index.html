<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@font-face{font-family:"Dubai";font-weight:400;src:url(/assets/fonts/Dubai-Regular.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Dubai";font-weight:700;src:url(/assets/fonts/Dubai-Bold.ttf) format("truetype");font-display:swap}
/* Layout: one continuous surface, no bands. A phone rises under the headline, sticks in the centre and changes screen
   as you scroll; each topic's text passes beside it and lime tags pop in around it. Corner Ask chat on top. */
:root{
  --black:#111111; --lime:#DFF903;
  --bg:#FFFFFF; --ink:#111111; --ink-2:#484848; --ink-3:#717171; --card:#FFFFFF; --soft:#F4F1EA; --line:#E4DFD3;
  --screen:#FFFFFF; --dots:#111111; --shadow:rgba(30,25,10,.22);
  --display:"Archivo","Dubai",system-ui,sans-serif;  /* stand-in for Racleys until the licence is bought */
  --body:"Archivo","Dubai",system-ui,sans-serif;
  --ar:"Dubai","Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --ink:#F2F2F2; --ink-2:#C9C9C9; --ink-3:#8E8E8E; --card:#171717; --soft:#1E1E1E; --line:#262626; --screen:#121212; --dots:#DFF903; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0B; --ink:#F2F2F2; --ink-2:#C9C9C9; --ink-3:#8E8E8E; --card:#171717; --soft:#1E1E1E; --line:#262626; --screen:#121212; --dots:#DFF903; --shadow:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
html[dir="rtl"] body{font-family:var(--ar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer} p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h4{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.02em}
html[dir="rtl"] :is(h1,h2,h4){letter-spacing:0;font-family:var(--ar);font-weight:700}

/* top bar: floats on the same surface, no line */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 21px/1 var(--display);letter-spacing:-.02em}
.brand svg{height:30px;width:auto}
.bar .sp{flex:1}
.lang{background:none;border:1.5px solid var(--ink);border-radius:999px;height:38px;min-width:46px;padding:0 12px;font-weight:700}
.get{display:inline-flex;align-items:center;background:var(--black);color:#fff;border-radius:999px;height:40px;padding:0 18px;font-weight:700;text-decoration:none;white-space:nowrap}
:root[data-theme="dark"] .get{background:var(--lime);color:var(--black)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .get{background:var(--lime);color:var(--black)}}
.get:active,.store:active,.chip:active{transform:scale(.97)}

/* hero text */
.hero{text-align:center;min-height:calc(100vh - 68px - 150px);display:flex;flex-direction:column;justify-content:center;padding-block:24px}
.hero h1{font-size:clamp(46px,8.6vw,124px);line-height:.9;font-weight:700}
.mark{background:linear-gradient(transparent 16%,var(--lime) 16%,var(--lime) 94%,transparent 94%);color:var(--black);padding:0 .1em;border-radius:.1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero .sub{margin:22px auto 0;font-size:clamp(17px,1.5vw,20px);color:var(--ink-2);max-width:34ch}
/* Arabic: Dubai's glyph box is much taller than Archivo's, so the English .9 line height made the lime band
   cover the line above and the subtitle (founder screenshot 2026-11-11). Looser lines + a band trimmed to the letters. */
html[dir="rtl"] .hero h1{line-height:1.12}
html[dir="rtl"] .hero h1 .mark{background:linear-gradient(transparent 30%,var(--lime) 30%,var(--lime) 84%,transparent 84%)}
html[dir="rtl"] .hero .sub{margin-top:14px}
.stores{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:26px}
.store{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:14px;background:var(--black);color:#fff;text-decoration:none;font-weight:700;line-height:1.05;text-align:start}
:root[data-theme="dark"] .store{background:#fff;color:var(--black)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .store{background:#fff;color:var(--black)}}
.store small{display:block;font-size:11px;font-weight:500;opacity:.7}
.store svg{width:22px;height:22px;flex:none}
.qr{display:none;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;line-height:1.3;text-align:start}
.qr .code{background:#fff;padding:6px;border-radius:10px;width:64px;height:64px}
.qr .code img,.qr .code canvas{width:52px!important;height:52px!important;display:block}
.desktop .qr{display:flex}

/* ---------- the story: sticky phone ---------- */
.story{position:relative}
.stick{position:sticky;top:calc(50vh - var(--ph)/2 + 34px);height:var(--ph);display:flex;justify-content:center;z-index:2;pointer-events:none;--ph:min(820px,calc(100vh - 150px))}
.phone{pointer-events:auto;position:relative;height:var(--ph);aspect-ratio:300/620;border-radius:calc(var(--ph)*.075);background:#0A0A0A;padding:calc(var(--ph)*.016);box-shadow:0 40px 80px -30px var(--shadow),0 0 0 1.5px #2A2A2A inset}
.scr{position:relative;height:100%;border-radius:calc(var(--ph)*.06);overflow:hidden;background:var(--screen);container-type:size}
.notch{position:absolute;top:1.6%;left:50%;width:30%;height:3.6%;margin-left:-15%;background:#0A0A0A;border-radius:999px;z-index:5}
.view{will-change:opacity,transform;position:absolute;inset:0;padding:13cqh 5.5cqw 4cqh;display:flex;flex-direction:column;gap:2.2cqh;opacity:0;transform:translateY(3cqh) scale(.98);font-size:4.4cqw}
.view.on{opacity:1;transform:none}
.vh{display:flex;align-items:center;gap:3cqw;font:700 5.6cqw/1 var(--display)}
html[dir="rtl"] .vh{font-family:var(--ar)}
.tile{width:9cqw;height:9cqw;border-radius:2.6cqw;background:var(--lime);display:grid;place-items:center;flex:none}
/* screen 0: empty chat */
.v0 .big{flex:1;display:grid;place-items:center;align-content:center;gap:3cqh;text-align:center}
.v0 .big p{font:700 7cqw/1.15 var(--display);max-width:16ch}
html[dir="rtl"] .v0 .big p{font-family:var(--ar)}
.v0 .sc{display:flex;flex-direction:column;gap:1.4cqh}
.v0 .sc span{border:1px solid var(--line);border-radius:999px;padding:1.4cqh 4cqw;font-size:3.9cqw;color:var(--ink);background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{border-radius:999px;background:var(--soft);padding:1.8cqh 4.5cqw;color:var(--ink-3);font-size:3.9cqw;display:flex;justify-content:space-between;align-items:center}
.inp i{font-style:normal;width:7.5cqw;height:7.5cqw;border-radius:50%;background:var(--black);color:var(--lime);display:grid;place-items:center}
/* screen 1: answer */
.me{align-self:flex-end;background:var(--black);color:#fff;border-radius:5cqw 5cqw 1.2cqw 5cqw;padding:1.6cqh 4cqw;font-weight:600;max-width:85%}
:root[data-theme="dark"] .me{background:#2A2A2A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .me{background:#2A2A2A}}
.mini{display:grid;grid-template-columns:17cqw 1fr auto;gap:3cqw;align-items:center;background:var(--soft);border-radius:4cqw;padding:2cqw}
.mini img{width:17cqw;height:17cqw;border-radius:3cqw;object-fit:cover;display:block}
.mini b{display:block;font-size:4.2cqw;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;color:var(--ink-3);font-size:3.4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini > div{min-width:0}
.mini em{font:700 3.9cqw/1 var(--display);font-style:normal;background:var(--black);color:#fff;border-radius:2.4cqw;padding:1.5cqw 2cqw;white-space:nowrap}
/* screen 2: picked for you */
.pick{flex:1;position:relative;border-radius:6cqw;overflow:hidden;color:#fff}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick .sh{position:absolute;inset:auto 0 0;padding:5cqw;background:linear-gradient(to top,rgba(0,0,0,.85),transparent)}
.pick .t{font:700 7cqw/1.05 var(--display)}
.pick .m{font-size:3.7cqw;color:#ddd;margin-top:.8cqh}
.fits{display:flex;flex-wrap:wrap;gap:1.6cqw;margin-top:1.6cqh}
.fits b{font-size:3.3cqw;background:var(--lime);color:var(--black);border-radius:999px;padding:1cqh 2.6cqw}
.fits span{font-size:3.3cqw;font-weight:600;background:rgba(255,255,255,.18);border-radius:999px;padding:1cqh 2.6cqw}
.acts{display:flex;justify-content:center;gap:6cqw}
.acts span{width:14cqw;height:14cqw;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:5.5cqw}
.acts span.y{background:var(--black);color:var(--lime)}
/* screen 3: emirates */
.erow{display:grid;grid-template-columns:30cqw 1fr 11cqw;gap:2.6cqw;align-items:center;font-size:3.8cqw}
.erow b{font-weight:700}
.erow .tr{height:2.6cqw;border-radius:999px;background:var(--soft)}
.erow .fl{display:block;height:100%;border-radius:999px;background:var(--ink)}
.erow em{font-style:normal;font-weight:700;text-align:end;font-variant-numeric:tabular-nums}
.ebox{background:var(--card);border-radius:5cqw;padding:4cqw;display:grid;gap:1.8cqh;border:1px solid var(--line)}
/* screen 4: points */
.pbox{background:var(--black);color:#fff;border-radius:6cqw;padding:5cqw}
.pbox .n{font:700 15cqw/1 var(--display)}
.pbox .n small{font-size:4.4cqw;color:#bbb;font-weight:700;margin-inline-start:1.5cqw}
.pbox .rd{margin-top:2cqh;background:var(--lime);color:var(--black);border-radius:3.6cqw;padding:2cqh 3.5cqw;font-weight:700;font-size:3.8cqw}
.prow{display:flex;justify-content:space-between;padding:1.8cqh .5cqw;border-bottom:1px solid var(--line);font-size:3.9cqw}
.prow b{font-variant-numeric:tabular-nums}

/* lime tags around the phone */
.tags{position:absolute;inset:0;pointer-events:none}
.tag{will-change:opacity,transform;position:absolute;background:var(--lime);color:var(--black);font:700 clamp(13px,1.15vw,16px)/1 var(--display);padding:12px 16px;border-radius:14px;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(0,0,0,.35);opacity:0;transform:translate(var(--x,0),12px) rotate(var(--r,0deg)) scale(.86);transition:opacity .35s ease,transform .5s cubic-bezier(.3,1.4,.5,1)}
.tag.dark{background:var(--black);color:#fff}
:root[data-theme="dark"] .tag.dark{background:#fff;color:var(--black)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.dark{background:#fff;color:var(--black)}}
.tag.on{opacity:1;transform:translate(var(--x,0),0) rotate(var(--r,0deg)) scale(1)}
html[dir="rtl"] .tag{font-family:var(--ar)}

.prog{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);display:flex;gap:6px;opacity:0;transition:opacity .3s}
.prog.show{opacity:1}
.prog i{display:block;width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s}
.prog i.on{width:30px;background:var(--ink)}
.typed::after{content:"";display:inline-block;width:2px;height:1.1em;margin-inline-start:2px;vertical-align:-.15em;background:var(--ink);animation:blink 1s steps(1) infinite}
.inp .typed{color:var(--ink)}
@keyframes blink{50%{opacity:0}}
.view.on .me{animation:pop .45s cubic-bezier(.2,.8,.2,1) both .1s}
.view.on .mini,.view.on .intro{animation:drop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*170ms + 500ms)}
@keyframes drop{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
.acts .y{position:relative}
.tap{position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--ink);opacity:0;pointer-events:none}
.view.on .tap{animation:tap 1.8s ease-out infinite .6s}
@keyframes tap{0%{opacity:.7;transform:scale(.7)}70%,100%{opacity:0;transform:scale(1.9)}}
.view.on .rd{animation:pop .45s cubic-bezier(.3,1.4,.5,1) both 1.1s}
.view.on .prow{animation:drop .45s both;animation-delay:calc(var(--d,0)*140ms + 300ms)}
/* the seven emirates, after the guide */
.emir{padding-block:120px 40px;overflow:hidden}
.emir h2{font-size:clamp(34px,4.6vw,64px);line-height:1;font-weight:700;margin-top:14px;max-width:16ch}
.marq{margin-top:44px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mtrack{display:flex;width:max-content;gap:0;animation:marq 48s linear infinite;direction:ltr}
.mtrack span{display:flex;align-items:baseline;gap:14px;padding-inline:28px;font:700 clamp(40px,6vw,88px)/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
html[dir="rtl"] .mtrack span{font-family:var(--ar);letter-spacing:0}
.mtrack span small{font:700 clamp(16px,1.6vw,22px)/1 var(--display);color:var(--black);background:var(--lime);border-radius:999px;padding:.4em .7em;letter-spacing:0;align-self:center;font-variant-numeric:tabular-nums}
.mtrack i{display:flex;gap:7px;align-items:center;align-self:center}
.mtrack i::before,.mtrack i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ink)}
@keyframes marq{to{transform:translateX(-50%)}}
.marq:hover .mtrack{animation-play-state:paused}
.emir .note{margin-top:22px;color:var(--ink-3);font-size:14px}
/* step texts scroll past the phone */
.steps{position:relative;z-index:3;margin-top:calc(-1 * min(820px,calc(100vh - 150px)))}
.step{min-height:78vh;display:flex;align-items:center}
.step:first-child{min-height:calc(min(820px,calc(100vh - 150px)) + 10vh)}
.step .txt{width:calc(50% - 225px);max-width:460px;will-change:opacity}
.step.r{justify-content:flex-end}
.step.l .txt{margin-inline-start:0}
.kicker{font:700 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
html[dir="rtl"] .kicker{letter-spacing:0}
.step h2{font-size:clamp(34px,3.9vw,60px);line-height:1;font-weight:700;margin-top:14px}
.step p{margin-top:16px;font-size:18px;color:var(--ink-2)}
.try{display:inline-flex;margin-top:22px;align-items:center;gap:8px;border:1.5px solid var(--ink);background:none;border-radius:999px;height:44px;padding:0 18px;font-weight:700}

/* finish */
.end{text-align:center;padding-block:60px 120px}
.end h2{font-size:clamp(40px,6vw,84px);line-height:.95;font-weight:700;margin-top:26px}
.end p{margin-top:14px;color:var(--ink-2);font-size:18px}
#endDots{margin:0 auto}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;padding-block:24px calc(104px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--ink-3)}
footer a{text-decoration:none} footer a:hover{color:var(--ink)} footer .sp{flex:1}

/* ---------- corner chat ---------- */
.fab.quiet .lbl{opacity:0;transform:translateX(8px);pointer-events:none}
.fab.quiet:hover .lbl,.fab.quiet:focus-visible .lbl{opacity:1;transform:none}
.fab{position:fixed;z-index:70;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:calc(20px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
html[dir="rtl"] .fab{right:auto;left:calc(20px + env(safe-area-inset-left,0px));flex-direction:row-reverse}
.fab .lbl{transition:opacity .35s ease,transform .35s ease;background:var(--black);color:#fff;font-weight:700;border-radius:999px;padding:9px 14px;font-size:14px;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.fab .btn{width:60px;height:60px;border-radius:50%;background:var(--black);display:grid;place-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.55);transition:transform .15s}
.fab:active .btn{transform:scale(.94)}
.fab[hidden]{display:none}
.panel{position:fixed;z-index:80;top:calc(80px + env(safe-area-inset-top,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));right:calc(20px + env(safe-area-inset-right,0px));width:400px;max-width:calc(100vw - 40px);background:var(--card);color:var(--ink);border-radius:26px;box-shadow:0 30px 80px -24px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s}
html[dir="rtl"] .panel{right:auto;left:calc(20px + env(safe-area-inset-left,0px));transform-origin:bottom left}
.panel.closed{transform:translateY(16px) scale(.96);opacity:0;pointer-events:none}
.ph{display:flex;align-items:center;gap:10px;padding:16px 14px 10px 16px}
.ph h3{margin:0;font:700 17px/1 var(--display);flex:1}
html[dir="rtl"] .ph h3{font-family:var(--ar)}
.ph .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:18px;line-height:1}
.av{flex:none;width:30px;height:30px;border-radius:9px;background:var(--lime);display:grid;place-items:center}
.pb{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.4}
.bub.mine{align-self:flex-end;background:var(--black);color:#fff;border-radius:18px 18px 4px 18px}
html[dir="rtl"] .bub.mine{border-radius:18px 18px 18px 4px}
.bot{display:flex;gap:10px;align-items:flex-start}
.bot .body{flex:1;min-width:0}
.bot .bub{background:var(--soft);border-radius:4px 18px 18px 18px;max-width:100%}
html[dir="rtl"] .bot .bub{border-radius:18px 4px 18px 18px}
.cafes{display:grid;gap:8px;margin-top:10px}
.cafe{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:7px;border-radius:14px;background:var(--soft);text-decoration:none;color:inherit;transition:transform .15s}
.cafe:active{transform:scale(.97)}
.cafe img{width:56px;height:56px;border-radius:10px;object-fit:cover;display:block}

function idle(t){const amp=1.6,dx=Math.sin(t/2300)*amp*.8+Math.sin(t/3700)*amp*.4,dy=Math.sin(t/2900)*amp*.6,br=Math.sin(t/3100)*.9;return P(dx-br,dy,dx+br,dy);}
function curious(t){const side=t%6400<3200?-1:1,u=t%3200,m=10,lean=5;const look=tilt(side*m,-2,side*11,0),peer=tilt(side*(m+lean),-3,side*13,-4);
  return track([[0,P()],[650,look],[1250,look],[1750,peer],[2550,peer],[3000,P()],[3200,P()]],u,false);}
function thinking(t){const up=-9,UR=tilt(9,up,0,-3),UL=tilt(-9,up,0,-3),URf=tilt(7,up-1,0,-9),ULs=tilt(-4,up+1,0,-2);
  if(t<450)return track([[0,P()],[450,UR]],t,false);
  return track([[0,UR],[700,UR],[860,UL],[1500,UL],[1640,ULs],[1900,ULs],[2060,URf],[2600,URf],[2760,UR],[3000,UR]],t-450,true);}
function found(t){const close=(GAP-2*R-6)/2,lift=4;return track([[0,P()],[340,P(close,0,-close,0)],[520,P(close,0,-close,0,1.06)],[900,P(0,-lift,0,-lift,1)],[1300,P()]],t,false);}

const all=[];
function Dots(el,{size=40,color='var(--dots)',interactive=false}={}){
  const scale=size/132,d=R*2*scale;
  el.style.cssText+=`position:relative;width:${size}px;height:${size*.6}px;direction:ltr;display:block`;
  const mk=()=>{const s=document.createElement('span');s.style.cssText=`position:absolute;left:50%;top:50%;width:${d}px;height:${d}px;margin:${-d/2}px 0 0 ${-d/2}px;border-radius:50%;background:${color};will-change:transform`;el.appendChild(s);return s;};
  const a=mk(),b=mk();
  const o={el,scale,pose:P(),mode:'idle',t0:performance.now(),pointer:null,interactive,a,b,visible:true,
    set(m){o.mode=m;o.t0=performance.now();},
    draw(){const p=o.pose;a.style.transform=`translate(${(-GAP/2+p.x1)*scale}px,${p.y1*scale}px) scale(${p.s})`;b.style.transform=`translate(${(GAP/2+p.x2)*scale}px,${p.y2*scale}px) scale(${p.s})`;}};
  o.draw(); all.push(o);
  if('IntersectionObserver' in window) new IntersectionObserver(es=>es.forEach(e=>o.visible=e.isIntersecting)).observe(el);
  return o;
}
let last=performance.now();
function frame(now){
  const dt=Math.min(64,now-last); last=now;
  for(const o of all){ if(!o.visible||!o.el.isConnected) continue;
    const t=now-o.t0; let target; const m=o.mode;
    if(m==='found'){ target=found(t); if(t>1500){o.mode='idle';o.t0=now;} }
    else if(m==='thinking') target=thinking(t);
    else if(m==='curious') target=curious(t);
    else if(o.pointer){ const px=Math.max(-1,Math.min(1,o.pointer.x)),py=Math.max(-1,Math.min(1,o.pointer.y)),max=16;
      target=P(px*max*(px<0?1.15:.85),py*max*.6,px*max*(px<0?.85:1.15),py*max*.6); }
    else if(o.interactive && t%14000>9000) target=curious((t%14000)-9000);
    else target=idle(t);
    const k=1-Math.exp(-dt/(o.pointer?120:70)), c=o.pose;
    o.pose=P(c.x1+(target.x1-c.x1)*k,c.y1+(target.y1-c.y1)*k,c.x2+(target.x2-c.x2)*k,c.y2+(target.y2-c.y2)*k,c.s+(target.s-c.s)*k);
    o.draw();
  }
  requestAnimationFrame(frame);
}
if(!reduce) requestAnimationFrame(frame);

function stopTyping(){ clearTimeout(typeTimer); typeTimer=null; const el=document.querySelector('#scr [data-typed]'); if(el) el.textContent=t('inp'); if(bigDots) bigDots.set('idle'); }

function countPoints(){ const el=document.querySelector('#scr [data-count]'); if(!el||reduce) return; const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/1100); el.textContent=Math.round(15+25*(k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2)); if(k<1) requestAnimationFrame(step);}; requestAnimationFrame(step); }
function renderMarq(){ const names=t('emirates'), nums=['530+','280+','130+','50+','40','25+','12'];

function renderStory(){

function setStep(i,force){
  if(i===cur&&!force)return; cur=i;
  views.forEach((v,j)=>v.classList.toggle('on',j===SCREEN_OF[i]));

let watching=false;
const wide=()=>innerWidth>900;
function scrub(){
  const steps=[...document.querySelectorAll('#steps .step')]; if(!steps.length) return;
  const mid=innerHeight/2, c=steps.map(el=>{const r=el.getBoundingClientRect(); return r.top+r.height/2-mid;}); // 0 = centred
  // text brightness by distance from the centre
  steps.forEach((el,i)=>{ const k=Math.min(1,Math.abs(c[i])/(innerHeight*.5)); el.querySelector('.txt').style.opacity=wide()?(1-.82*k*k).toFixed(3):''; });
  // where we are between topics: f = i + fraction
  let f;
  if(c[0]>0) f=0; else if(c[c.length-1]<=0) f=c.length-1;
  else { let i=0; while(i<c.length-1 && c[i+1]<=0) i++; f=i+(-c[i])/(c[i+1]-c[i]); }
  const i=Math.floor(f), fr=f-i, k=Math.min(1,Math.max(0,(fr-.2)/.6)), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  if(wide()) views.forEach((v,j)=>{ const a=SCREEN_OF[i], b=SCREEN_OF[Math.min(i+1,STEPS.length-1)];
    let o=0,y=0; if(j===a){o=1;y=(a===b)?0:-e*100;} else if(j===b){o=1;y=(1-e)*100;}

}
