<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewMaps – Discover UAE's best cafés</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAF6F0;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .logo { font-size: 32px; font-weight: 700; color: #2B4D1F; letter-spacing: -0.5px; }
    .logo span { color: #C8914A; }
    .tagline { font-size: 17px; color: #666; margin-top: 12px; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 32px;
      background: #2B4D1F;
      color: #fff;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }
    .links { margin-top: 48px; display: flex; gap: 24px; }
    .links a { font-size: 14px; color: #2B4D1F; font-weight: 600; text-decoration: none; }
    footer { margin-top: 60px; font-size: 12px; color: #aaa; }

</head>

  <div class="logo">Brew<span>Maps</span></div>
  <p class="tagline">Discover UAE's best cafés,<br>matched to your taste.</p>
