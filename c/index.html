<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BrewMaps</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BrewMaps" />
  <meta property="og:title" id="og-title" content="BrewMaps" />
  <meta property="og:description" id="og-desc" content="Find cafés across all seven emirates, with real prices." />
  <meta property="og:image" id="og-image" content="https://www.brewmaps.app/logo.png" />
  <meta property="og:url" id="og-url" content="https://www.brewmaps.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="apple-itunes-app" content="app-id=6775899450" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/bm.css" />
</head>
<body>
  <!-- Fallback for cafés added after the last generate-cafe-pages run (vercel.json rewrites /c/:id here).
       Same design as the generated pages; no menu is fetched (founder 2026-11-11). -->
  <header class="bar"><div class="col">
    <a class="brand" href="/" aria-label="BrewMaps home"><img src="/logo.png" alt="" style="height:28px;width:28px;border-radius:8px">brewmaps</a>
    <span class="sp"></span><a class="get" data-store href="/download">Get the app</a>
  </div></header>
  <main class="col" id="content"><div class="err"><h2>Loading…</h2></div></main>
  <footer><div class="col"><span>© 2026 BrewMaps</span><span class="sp"></span><a href="https://wa.me/971529763232">For cafés</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div></footer>
  <script src="/assets/bm.js"></script>
  <script>
    const SUPABASE_URL = 'https://qgzyywxizlhtuwuaonxy.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnenl5d3hpemxodHV3dWFvbnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDI0NDMsImV4cCI6MjA5NDU3ODQ0M30.auFn0Nz_PTziNezXMQKXzd5jmlre3CZUR47emeXpHz8';
    const RATE_MODE = new URLSearchParams(location.search).get('rate') === '1';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function cafeId() {
      const m = location.pathname.match(/\/c\/([a-f0-9-]+)/i);
      return m ? m[1] : new URLSearchParams(location.search).get('id');
    }
    function err(msg) {
      document.getElementById('content').innerHTML = `<div class="err"><h2>${esc(msg)}</h2><p style="margin-top:12px;color:var(--ink-2)">Find cafés across all seven emirates in BrewMaps.</p><div class="stores" data-stores style="justify-content:center;margin-top:20px"></div></div>`;
      window.BMFill && BMFill();
    }
    async function load() {
      const id = cafeId(); if (!id) return err("Couldn't find this café.");
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/cafes?id=eq.${encodeURIComponent(id)}&select=id,name,area,summary,photo_urls,google_rating,google_review_count,price_range,wifi_quality,noise_level,power_outlets,parking,pet_friendly,lat,lng`, { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } });
        const rows = await res.json();
        if (!Array.isArray(rows) || !rows.length) return err("This café isn't on BrewMaps yet.");
        render(rows[0]);
      } catch (e) { err("Couldn't load this café. Try again."); }
    }
    function render(c) {
      const photos = (c.photo_urls || []).slice(0, 3);
      const rating = c.google_rating ? Number(c.google_rating).toFixed(1) : '';
      const wifi = { good: 'Good Wi-Fi', basic: 'Basic Wi-Fi' }[c.wifi_quality];
      const noise = { quiet: 'Quiet', moderate: 'Some chatter', lively: 'Lively' }[c.noise_level];
      const plugs = { plenty: 'Plenty of plugs', many: 'Plenty of plugs', some: 'Some plugs', few: 'A few plugs' }[c.power_outlets];
      const facts = [wifi, noise, plugs, c.parking ? 'Parking' : null, c.pet_friendly ? 'Pet friendly' : null].filter(Boolean);
      document.title = `${c.name} | BrewMaps`;
      document.getElementById('og-title').setAttribute('content', `${c.name} | BrewMaps`);
      document.getElementById('og-desc').setAttribute('content', c.summary || `A café in ${c.area || 'the UAE'} on BrewMaps.`);
      if (photos[0]) document.getElementById('og-image').setAttribute('content', photos[0]);
      document.getElementById('og-url').setAttribute('content', `https://www.brewmaps.app/c/${c.id}`);
      document.getElementById('content').innerHTML = `
        <div class="crumb"><a href="/">BrewMaps</a>${c.area ? ' › ' + esc(c.area) : ''}</div>
        ${photos.length ? `<div class="photos${photos.length < 3 ? ' one' : ''}">${(photos.length >= 3 ? photos : photos.slice(0, 1)).map((p, i) => `<img src="${esc(p)}" alt="${i ? '' : esc(c.name)}">`).join('')}</div>` : ''}
        <h1>${esc(c.name)}</h1>
        <p class="where">${esc(c.area || '')}${c.price_range ? ' · ' + '$'.repeat(c.price_range) : ''}</p>
        <div class="line">${rating ? `<span class="rate">★ ${rating}${c.google_review_count ? ` <small>${c.google_review_count} reviews</small>` : ''}</span>` : ''}${facts.map((f) => `<span class="pill">${esc(f)}</span>`).join('')}</div>
        ${RATE_MODE ? `<div class="ratep"><h2>How was your coffee?</h2><p>Rate what you ordered. It takes a few seconds, and it helps ${esc(c.name)} see what people love.</p><a href="#" class="go" id="rate-open" data-deep="brewmaps://c/${c.id}">Rate it in BrewMaps</a><ol><li>No app yet? Tap above to get BrewMaps (it's free).</li><li>Then <b>scan this code again</b>. It opens straight here.</li></ol></div>` : ''}
        ${c.summary ? `<p class="about">${esc(c.summary)}</p>` : ''}
        <section><div class="full"><span data-dots="56"></span><div><h3>See the menu in the app</h3><p>Drinks with prices, photos and more, free in the app.</p></div><div class="stores" data-stores></div></div></section>
        ${c.lat && c.lng ? `<section><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}">Get directions <span aria-hidden="true">→</span></a></section>` : ''}`;
      window.BMFill && BMFill();
      document.querySelectorAll('[data-dots]').forEach((el) => window.BMDots && BMDots(el, { size: 56, color: '#DFF903', interactive: true }));
      const rate = document.getElementById('rate-open');
      if (rate) rate.addEventListener('click', (e) => {
        e.preventDefault(); let bailed = false; const onHide = () => { bailed = true; };
        document.addEventListener('visibilitychange', onHide, { once: true });
        setTimeout(() => { document.removeEventListener('visibilitychange', onHide); if (!bailed && !document.hidden) location.href = '/download'; }, 1400);
        location.href = rate.dataset.deep;
      });
    }
    load();
  </script>
</body>
</html>
