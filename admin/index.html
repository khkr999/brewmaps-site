<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewMaps Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--forest:#2B4D1F;--forest2:#3a6429;--caramel:#C4956A;--cream:#FFFDF9;--sand:#F5F0E8;--stone:#8a7968;--border:#e8e0d4;--red:#e74c3c;--amber:#f39c12;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--sand);color:#2a2218;min-height:100vh;}

    /* Login */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--forest);}
    .login-card{background:var(--cream);border-radius:20px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.3);}
    .login-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;color:var(--forest);margin-bottom:6px;}
    .login-sub{font-size:13px;color:var(--stone);margin-bottom:32px;}
    .login-input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-family:'Inter',sans-serif;background:var(--sand);outline:none;transition:border-color .2s;margin-bottom:12px;}
    .login-input:focus{border-color:var(--forest);}
    .login-btn{width:100%;padding:14px;background:var(--forest);color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
    .login-btn:hover{background:var(--forest2);}
    .login-error{color:var(--red);font-size:13px;margin-top:10px;}

    /* Dashboard */
    #dashboard{display:none;}
    header{background:var(--forest);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;}
    .header-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:var(--cream);}
    .header-right{display:flex;align-items:center;gap:12px;}
    .header-meta{font-size:12px;color:rgba(255,255,255,0.45);}
    .refresh-btn{background:rgba(255,255,255,0.12);border:none;color:white;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
    .refresh-btn:hover{background:rgba(255,255,255,0.22);}

    /* Filters bar */
    .filters-bar{background:var(--cream);border-bottom:1px solid var(--border);padding:10px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
    .filter-group{display:flex;align-items:center;gap:8px;}
    .filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--stone);}
    .pill{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--sand);color:var(--stone);cursor:pointer;transition:all .15s;}
    .pill:hover{border-color:var(--forest);color:var(--forest);}
    .pill.active{background:var(--forest);color:white;border-color:var(--forest);}

    main{max-width:1200px;margin:0 auto;padding:28px 24px;}
    .section-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin:32px 0 12px;}
    .section-title:first-child{margin-top:0;}

    /* KPI grid */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
    .kpi-card{background:var(--cream);border-radius:16px;padding:18px 20px;border:1px solid var(--border);transition:transform .15s;}
    .kpi-card:hover{transform:translateY(-2px);}
    .kpi-card.accent{background:var(--forest);border-color:var(--forest);}
    .kpi-card.warn{border-color:var(--red);}
    .kpi-label{font-size:11px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
    .kpi-card.accent .kpi-label{color:rgba(255,255,255,0.6);}
    .kpi-value{font-size:30px;font-weight:700;color:var(--forest);line-height:1;}
    .kpi-card.accent .kpi-value{color:white;}
    .kpi-card.warn .kpi-value{color:var(--red);}
    .kpi-sub{font-size:12px;color:var(--stone);margin-top:5px;}
    .kpi-card.accent .kpi-sub{color:rgba(255,255,255,0.5);}

    /* Tables */
    .tables-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:720px){.tables-grid{grid-template-columns:1fr;}}
    .table-card{background:var(--cream);border-radius:16px;border:1px solid var(--border);overflow:hidden;}
    .table-header{padding:14px 18px 10px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--forest);display:flex;align-items:center;justify-content:space-between;}
    .table-badge{font-size:11px;font-weight:700;background:var(--red);color:white;padding:2px 8px;border-radius:999px;}
    table{width:100%;border-collapse:collapse;}
    td,th{padding:10px 16px;font-size:13px;text-align:left;}
    th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--stone);background:var(--sand);}
    tr:not(:last-child) td{border-bottom:1px solid var(--border);}
    .rank{font-weight:700;color:var(--stone);}
    .cafe-name{font-weight:600;}
    .cafe-area{font-size:11px;color:var(--stone);}
    .count-badge{display:inline-block;background:var(--forest);color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}

    /* Moderation */
    .mod-row{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);}
    .mod-row:last-child{border-bottom:none;}
    .mod-avatar{width:36px;height:36px;border-radius:50%;background:var(--forest);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
    .mod-info{flex:1;}
    .mod-name{font-weight:700;font-size:13px;margin-bottom:2px;}
    .mod-detail{font-size:12px;color:var(--stone);}
    .mod-reason{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:4px;}
    .reason-spam{background:#fef3cd;color:#856404;}
    .reason-inappropriate{background:#fde8e8;color:#c0392b;}
    .reason-wrong_cafe{background:#e8f4f8;color:#2471a3;}
    .reason-other{background:var(--sand);color:var(--stone);}
    .mod-actions{display:flex;gap:6px;flex-shrink:0;margin-top:2px;}
    .ban-btn{padding:5px 12px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s;}
    .ban-btn:disabled{opacity:.5;cursor:default;}
    .ban-btn.red{background:var(--red);color:white;}
    .ban-btn.red:hover:not(:disabled){opacity:.85;}
    .ban-btn.grey{background:var(--border);color:var(--stone);}
    .ban-btn.grey:hover:not(:disabled){background:#d0c8be;}
    .banned-badge{font-size:11px;font-weight:700;color:var(--red);background:#fde8e8;padding:2px 8px;border-radius:999px;}
    .empty-state{padding:28px;text-align:center;color:#999;font-size:13px;}

    /* Bar chart */
    .bar-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:720px){.bar-grid{grid-template-columns:1fr;}}
    .bar-card{background:var(--cream);border-radius:16px;border:1px solid var(--border);padding:18px 20px;}
    .bar-card-title{font-size:13px;font-weight:700;color:var(--forest);margin-bottom:14px;}
    .bar-row{margin-bottom:11px;}
    .bar-row:last-child{margin-bottom:0;}
    .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
    .bar-name{font-weight:600;}
    .bar-count{color:var(--stone);}
    .bar-track{background:var(--sand);border-radius:999px;height:6px;overflow:hidden;}
    .bar-fill{height:100%;background:var(--forest);border-radius:999px;transition:width .6s ease;}

    .loading{text-align:center;padding:80px;color:var(--stone);font-size:15px;}
    .dot-pulse::after{content:'...';animation:dots 1.2s steps(4,end) infinite;}
    @keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
    .last-updated{font-size:12px;color:var(--stone);text-align:right;margin-top:28px;padding-bottom:28px;}
    .live-dot{display:inline-block;width:7px;height:7px;background:#2ecc71;border-radius:50%;margin-right:5px;animation:pulse 1.5s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">BrewMaps</div>
    <div class="login-sub">Admin Dashboard</div>
    <input id="secret-input" class="login-input" type="password" placeholder="Admin password" />
    <button class="login-btn" onclick="login()">Access Dashboard</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <header>
    <div class="header-logo">BrewMaps Admin</div>
    <div class="header-right">
      <div class="header-meta" id="last-fetch"></div>
      <button class="refresh-btn" onclick="loadStats()">↻ Refresh</button>
    </div>
  </header>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="filter-group">
      <span class="filter-label">Period</span>
      <div style="display:flex;gap:6px" id="pills-period">
        <button class="pill" data-val="7" onclick="setPeriod(7)">7 days</button>
        <button class="pill active" data-val="30" onclick="setPeriod(30)">30 days</button>
        <button class="pill" data-val="90" onclick="setPeriod(90)">90 days</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Moderation</span>
      <div style="display:flex;gap:6px" id="pills-mod">
        <button class="pill active" data-val="all" onclick="setModFilter('all')">All</button>
        <button class="pill" data-val="flagged" onclick="setModFilter('flagged')">Flagged comments</button>
        <button class="pill" data-val="reports" onclick="setModFilter('reports')">Post reports</button>
        <button class="pill" data-val="banned" onclick="setModFilter('banned')">Banned</button>
      </div>
    </div>
  </div>

  <main id="main-content">
    <div class="loading"><span class="dot-pulse">Loading</span></div>
  </main>
</div>

<script>
const ENDPOINT = 'https://qgzyywxizlhtuwuaonxy.supabase.co/functions/v1/admin-stats';
let adminSecret = '';
let rawData = null;
let period = 30;
let modFilter = 'all';

// ── Login ─────────────────────────────────────────────────────────────────────
document.getElementById('secret-input').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) return;
  adminSecret = val;
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  await loadStats();
}

// ── Filters ───────────────────────────────────────────────────────────────────
function setPeriod(val) {
  period = val;
  document.querySelectorAll('#pills-period .pill').forEach(p => p.classList.toggle('active', p.dataset.val == val));
  if (rawData) render(rawData);
}
function setModFilter(val) {
  modFilter = val;
  document.querySelectorAll('#pills-mod .pill').forEach(p => p.classList.toggle('active', p.dataset.val === val));
  if (rawData) render(rawData);
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function loadStats() {
  document.getElementById('main-content').innerHTML = '<div class="loading"><span class="dot-pulse">Loading</span></div>';
  try {
    const res = await fetch(ENDPOINT + '?t=' + Date.now(), { headers: { 'x-admin-secret': adminSecret }, cache: 'no-store' });
    if (res.status === 401) {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('login-error').textContent = 'Wrong password.';
      return;
    }
    rawData = await res.json();
    document.getElementById('last-fetch').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render(rawData);
  } catch(e) {
    document.getElementById('main-content').innerHTML = '<div class="loading" style="color:#e74c3c">Failed to load.</div>';
  }
}

// ── Ban / Unban ───────────────────────────────────────────────────────────────
async function toggleBan(userId, ban) {
  const btn = document.getElementById('ban-btn-' + userId);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  const res = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'x-admin-secret': adminSecret, 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: ban ? 'ban' : 'unban', userId }),
  });
  const result = await res.json();

  if (result.ok) {
    // Update rawData in memory immediately so render reflects the change
    // regardless of any caching on the subsequent GET
    if (rawData) {
      for (const f of (rawData.flaggedUsers ?? [])) {
        if (f.user_id === userId && f.profiles) f.profiles.is_banned = ban;
      }
      if (ban) {
        rawData.bannedUsers = rawData.bannedUsers ?? [];
        const profile = rawData.flaggedUsers?.find(f => f.user_id === userId)?.profiles;
        if (profile && !rawData.bannedUsers.find(u => u.id === userId)) {
          rawData.bannedUsers.push({ id: userId, username: profile.username, banned_at: new Date().toISOString(), violation_count: profile.violation_count });
        }
      } else {
        rawData.bannedUsers = (rawData.bannedUsers ?? []).filter(u => u.id !== userId);
      }
      render(rawData);
    }
    // Then do a full refresh in the background to sync everything
    loadStats();
  } else {
    if (btn) { btn.disabled = false; btn.textContent = ban ? 'Ban' : 'Unban'; }
    alert('Action failed: ' + (result.error ?? 'Unknown error'));
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n) { return (n??0).toLocaleString(); }
function timeAgo(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}
function initial(username) { return (username||'?')[0].toUpperCase(); }

// ── Render ────────────────────────────────────────────────────────────────────
function render(d) {
  const retPct = d.users.total > 0 ? Math.round(d.users.activeThisWeek/d.users.total*100) : 0;
  const engPct = d.users.total > 0 ? Math.round(d.users.engaged/d.users.total*100) : 0;

  // Top cafés
  const topCheckinRows = d.topCafesByCheckins.map((c,i) => `
    <tr><td class="rank">#${i+1}</td>
    <td><div class="cafe-name">${c.name}</div><div class="cafe-area">${c.area}</div></td>
    <td><span class="count-badge">${c.count}</span></td></tr>`).join('') ||
    '<tr><td colspan="3" class="empty-state">No data yet</td></tr>';

  const topPostRows = d.topCafesByPosts.map((c,i) => `
    <tr><td class="rank">#${i+1}</td>
    <td><div class="cafe-name">${c.name}</div><div class="cafe-area">${c.area}</div></td>
    <td><span class="count-badge">${c.count}</span></td></tr>`).join('') ||
    '<tr><td colspan="3" class="empty-state">No data yet</td></tr>';

  // Emirate bars
  const maxEm = d.checkins.byEmirate[0]?.[1] || 1;
  const emirateBars = d.checkins.byEmirate.map(([name, count]) => `
    <div class="bar-row">
      <div class="bar-label"><span class="bar-name">${name}</span><span class="bar-count">${count}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxEm*100)}%"></div></div>
    </div>`).join('') || '<div style="color:#999;font-size:13px">No data yet</div>';

  // ── Moderation sections ────────────────────────────────────────────────────
  const flagged = d.flaggedUsers ?? [];
  const reports = d.postReports ?? [];
  const banned  = d.bannedUsers ?? [];

  // Aggregate flagged by user
  const userMap = {};
  for (const f of flagged) {
    const uid = f.user_id;
    if (!userMap[uid]) userMap[uid] = { ...f.profiles, id: uid, flags: [], count: 0 };
    userMap[uid].flags.push(f);
    userMap[uid].count++;
  }
  const flaggedList = Object.values(userMap).sort((a,b) => b.count - a.count);

  const flaggedRows = flaggedList.length ? flaggedList.map(u => `
    <div class="mod-row">
      <div class="mod-avatar">${initial(u.username)}</div>
      <div class="mod-info">
        <div class="mod-name">@${u.username ?? 'unknown'}</div>
        <div class="mod-detail">${u.count} violation${u.count>1?'s':''} · Last: ${timeAgo(u.flags[0].created_at)}</div>
        <span class="mod-reason reason-${u.flags[0].reason?.split(' ')[0] ?? 'other'}">${u.flags[0].reason ?? 'unknown'}</span>
        ${u.is_banned ? '<span class="banned-badge" style="margin-left:6px">BANNED</span>' : ''}
      </div>
      <div class="mod-actions">
        ${u.is_banned
          ? `<button id="ban-btn-${u.id}" class="ban-btn grey" onclick="toggleBan('${u.id}',false)">Unban</button>`
          : `<button id="ban-btn-${u.id}" class="ban-btn red" onclick="toggleBan('${u.id}',true)">Ban</button>`}
      </div>
    </div>`).join('')
    : '<div class="empty-state">No flagged users 🎉</div>';

  const reportRows = reports.length ? reports.map(r => `
    <div class="mod-row">
      <div class="mod-info">
        <div class="mod-name">${r.post?.cafes?.name ?? 'Unknown café'}</div>
        <div class="mod-detail">Reported by @${r.reporter?.username ?? '?'} · ${timeAgo(r.created_at)}</div>
        <span class="mod-reason reason-${r.reason}">${r.reason?.replace('_',' ')}</span>
      </div>
      ${r.post?.photo_url ? `<img src="${r.post.photo_url}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0">` : ''}
    </div>`).join('')
    : '<div class="empty-state">No post reports 🎉</div>';

  const bannedRows = banned.length ? banned.map(u => `
    <div class="mod-row">
      <div class="mod-avatar" style="background:var(--red)">${initial(u.username)}</div>
      <div class="mod-info">
        <div class="mod-name">@${u.username ?? 'unknown'}</div>
        <div class="mod-detail">Banned ${timeAgo(u.banned_at)} · ${u.violation_count ?? 0} violations</div>
      </div>
      <div class="mod-actions">
        <button id="ban-btn-${u.id}" class="ban-btn grey" onclick="toggleBan('${u.id}',false)">Unban</button>
      </div>
    </div>`).join('')
    : '<div class="empty-state">No banned users</div>';

  // Which moderation section to show
  const showFlagged = modFilter === 'all' || modFilter === 'flagged';
  const showReports = modFilter === 'all' || modFilter === 'reports';
  const showBanned  = modFilter === 'all' || modFilter === 'banned';

  document.getElementById('main-content').innerHTML = `

    <div class="section-title">👥 Users · Last ${period} days</div>
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label">Total Users</div>
        <div class="kpi-value">${fmt(d.users.total)}</div>
        <div class="kpi-sub">All time</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">New Today</div>
        <div class="kpi-value">${d.users.newToday}</div>
        <div class="kpi-sub">Signed up today</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">New This Week</div>
        <div class="kpi-value">${d.users.newThisWeek}</div>
        <div class="kpi-sub">Last 7 days</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">New This Month</div>
        <div class="kpi-value">${d.users.newThisMonth}</div>
        <div class="kpi-sub">Last 30 days</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Active (7d)</div>
        <div class="kpi-value">${d.users.activeThisWeek}</div>
        <div class="kpi-sub">${retPct}% retention</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Engaged</div>
        <div class="kpi-value">${d.users.engaged}</div>
        <div class="kpi-sub">${engPct}% · 50+ points</div>
      </div>
    </div>

    <div class="section-title">✅ Check-ins</div>
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label">Total</div>
        <div class="kpi-value">${fmt(d.checkins.total)}</div>
        <div class="kpi-sub">All time</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Today</div>
        <div class="kpi-value">${d.checkins.today}</div>
        <div class="kpi-sub">So far</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">This Week</div>
        <div class="kpi-value">${d.checkins.thisWeek}</div>
        <div class="kpi-sub">Last 7 days</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg / Active User</div>
        <div class="kpi-value">${d.checkins.avgPerActiveUser}</div>
        <div class="kpi-sub">This week</div>
      </div>
    </div>

    <div class="section-title">📸 Vibes (Community)</div>
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label">Total Photos</div>
        <div class="kpi-value">${fmt(d.community.totalPosts)}</div>
        <div class="kpi-sub">All time approved</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Posted Today</div>
        <div class="kpi-value">${d.community.postsToday}</div>
        <div class="kpi-sub">Approved</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label"><span class="live-dot"></span>Live Now</div>
        <div class="kpi-value">${d.community.activePosts}</div>
        <div class="kpi-sub">Last 2 hours</div>
      </div>
      <div class="kpi-card ${(d.reports.thisWeek??0) > 5 ? 'warn' : ''}">
        <div class="kpi-label">Post Reports</div>
        <div class="kpi-value">${d.reports.thisWeek}</div>
        <div class="kpi-sub">This week · ${d.reports.total} total</div>
      </div>
      <div class="kpi-card ${(banned.length) > 0 ? 'warn' : ''}">
        <div class="kpi-label">Banned Users</div>
        <div class="kpi-value">${banned.length}</div>
        <div class="kpi-sub">Active bans</div>
      </div>
    </div>

    <div class="section-title">☕ Platform</div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Cafés in DB</div>
        <div class="kpi-value">${d.cafes.total}</div>
        <div class="kpi-sub">7 emirates</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Check-ins / Café</div>
        <div class="kpi-value">${d.cafes.total > 0 ? Math.round(d.checkins.total/d.cafes.total*10)/10 : 0}</div>
        <div class="kpi-sub">All time avg</div>
      </div>
    </div>

    <!-- Moderation -->
    ${showFlagged ? `
    <div class="section-title">🚨 Flagged Users (Comment Violations)
      ${flaggedList.length ? `<span style="margin-left:8px;background:var(--red);color:white;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700">${flaggedList.length}</span>` : ''}
    </div>
    <div class="table-card">${flaggedRows}</div>` : ''}

    ${showReports ? `
    <div class="section-title">🚩 Post Reports
      ${reports.length ? `<span style="margin-left:8px;background:var(--amber);color:white;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700">${reports.length}</span>` : ''}
    </div>
    <div class="table-card">${reportRows}</div>` : ''}

    ${showBanned ? `
    <div class="section-title">🔴 Banned Users</div>
    <div class="table-card">${bannedRows}</div>` : ''}

    <!-- Top Cafés -->
    <div class="section-title">🏆 Top Cafés (Last 30 Days)</div>
    <div class="tables-grid">
      <div class="table-card">
        <div class="table-header">By Check-ins</div>
        <table><thead><tr><th>#</th><th>Café</th><th>Count</th></tr></thead>
        <tbody>${topCheckinRows}</tbody></table>
      </div>
      <div class="table-card">
        <div class="table-header">By Community Photos</div>
        <table><thead><tr><th>#</th><th>Café</th><th>Count</th></tr></thead>
        <tbody>${topPostRows}</tbody></table>
      </div>
    </div>

    <!-- Emirate -->
    <div class="section-title">🗺️ Check-ins by Emirate</div>
    <div class="bar-grid">
      <div class="bar-card">
        <div class="bar-card-title">Distribution</div>
        ${emirateBars}
      </div>
      <div class="table-card">
        <div class="table-header">Breakdown</div>
        <table><thead><tr><th>Emirate</th><th>Check-ins</th><th>Share</th></tr></thead>
        <tbody>${d.checkins.byEmirate.map(([n,c]) =>
          `<tr><td class="cafe-name">${n}</td><td>${c}</td>
          <td style="color:var(--stone)">${d.checkins.total>0?Math.round(c/d.checkins.total*100):0}%</td></tr>`
        ).join('') || '<tr><td colspan="3" class="empty-state">No data</td></tr>'}</tbody></table>
      </div>
    </div>

    <div class="last-updated">
      Generated at ${new Date(d.generatedAt).toLocaleString('en-AE',{timeZone:'Asia/Dubai'})} (Dubai time)
    </div>
  `;
}
</script>
</body>
</html>
