<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewMaps Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --forest:  #2B4D1F;
      --forest2: #3a6429;
      --caramel: #C4956A;
      --cream:   #FFFDF9;
      --sand:    #F5F0E8;
      --stone:   #8a7968;
      --border:  #e8e0d4;
      --red:     #e74c3c;
      --amber:   #f39c12;
      --blue:    #2980b9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--sand);
      color: #2a2218;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--forest);
    }
    .login-card {
      background: var(--cream);
      border-radius: 20px;
      padding: 48px 40px;
      width: 360px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    }
    .login-logo {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 28px;
      color: var(--forest);
      margin-bottom: 6px;
    }
    .login-sub { font-size: 13px; color: var(--stone); margin-bottom: 32px; }
    .login-input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      background: var(--sand);
      outline: none;
      transition: border-color .2s;
      margin-bottom: 12px;
    }
    .login-input:focus { border-color: var(--forest); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--forest);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .login-btn:hover { background: var(--forest2); }
    .login-error { color: var(--red); font-size: 13px; margin-top: 10px; }

    /* ── Dashboard ── */
    #dashboard { display: none; }

    header {
      background: var(--forest);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--cream);
    }
    .header-meta { font-size: 12px; color: rgba(255,255,255,0.5); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .refresh-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background .2s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.2); }

    main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    /* ── Section title ── */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--stone);
      margin: 36px 0 14px;
    }
    .section-title:first-child { margin-top: 0; }

    /* ── KPI grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .kpi-card {
      background: var(--cream);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      transition: transform .15s;
    }
    .kpi-card:hover { transform: translateY(-2px); }
    .kpi-label { font-size: 11px; font-weight: 600; color: var(--stone); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .kpi-value { font-size: 32px; font-weight: 700; color: var(--forest); line-height: 1; }
    .kpi-sub { font-size: 12px; color: var(--stone); margin-top: 5px; }
    .kpi-card.accent { background: var(--forest); border-color: var(--forest); }
    .kpi-card.accent .kpi-label { color: rgba(255,255,255,0.6); }
    .kpi-card.accent .kpi-value { color: #fff; }
    .kpi-card.accent .kpi-sub { color: rgba(255,255,255,0.5); }
    .kpi-card.warn .kpi-value { color: var(--red); }

    /* ── Tables ── */
    .tables-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 720px) { .tables-grid { grid-template-columns: 1fr; } }

    .table-card {
      background: var(--cream);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .table-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      color: var(--forest);
    }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 11px 20px; font-size: 13px; text-align: left; }
    th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--stone); background: var(--sand); }
    tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
    .rank { font-weight: 700; color: var(--stone); }
    .cafe-name { font-weight: 600; color: #2a2218; }
    .cafe-area { font-size: 11px; color: var(--stone); }
    .count-badge {
      display: inline-block;
      background: var(--forest);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    /* ── Emirate bar chart ── */
    .emirate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .emirate-grid { grid-template-columns: 1fr; } }
    .bar-card {
      background: var(--cream);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 20px;
    }
    .bar-row { margin-bottom: 12px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .bar-name { font-weight: 600; }
    .bar-count { color: var(--stone); }
    .bar-track { background: var(--sand); border-radius: 999px; height: 7px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--forest); border-radius: 999px; transition: width .6s ease; }

    /* ── Loading / Error ── */
    .loading {
      text-align: center;
      padding: 80px;
      color: var(--stone);
      font-size: 15px;
    }
    .dot-pulse::after {
      content: '...';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

    .last-updated {
      font-size: 12px;
      color: var(--stone);
      text-align: right;
      margin-top: 32px;
      padding-bottom: 32px;
    }

    /* ── Live badge ── */
    .live-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #2ecc71;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">BrewMaps</div>
    <div class="login-sub">Admin Dashboard</div>
    <input id="secret-input" class="login-input" type="password" placeholder="Enter admin password" />
    <button class="login-btn" onclick="login()">Access Dashboard</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── Dashboard ─────────────────────────────────────────────── -->
<div id="dashboard">
  <header>
    <div class="header-logo">BrewMaps</div>
    <div class="header-right">
      <div class="header-meta" id="last-fetch"></div>
      <button class="refresh-btn" onclick="loadStats()">↻ Refresh</button>
    </div>
  </header>

  <main id="main-content">
    <div class="loading"><span class="dot-pulse">Loading</span></div>
  </main>
</div>

<script>
  const ENDPOINT = 'https://qgzyywxizlhtuwuaonxy.supabase.co/functions/v1/admin-stats';
  let adminSecret = '';

  // ── Login ──────────────────────────────────────────────────────
  document.getElementById('secret-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const val = document.getElementById('secret-input').value.trim();
    if (!val) return;
    adminSecret = val;
    document.getElementById('login-error').textContent = '';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadStats();
  }

  // ── Fetch stats ────────────────────────────────────────────────
  async function loadStats() {
    document.getElementById('main-content').innerHTML =
      '<div class="loading"><span class="dot-pulse">Loading</span></div>';
    try {
      const res = await fetch(ENDPOINT, {
        headers: { 'x-admin-secret': adminSecret, 'Content-Type': 'application/json' },
      });
      if (res.status === 401) {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('login-error').textContent = 'Wrong password.';
        return;
      }
      const data = await res.json();
      render(data);
      document.getElementById('last-fetch').textContent =
        'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById('main-content').innerHTML =
        '<div class="loading" style="color:#e74c3c">Failed to load. Check connection.</div>';
    }
  }

  // ── Render ─────────────────────────────────────────────────────
  function render(d) {
    const retentionPct = d.users.total > 0
      ? Math.round(d.users.activeThisWeek / d.users.total * 100) : 0;
    const engagedPct = d.users.total > 0
      ? Math.round(d.users.engaged / d.users.total * 100) : 0;

    const maxCheckin = d.checkins.byEmirate[0]?.[1] || 1;
    const emirateBars = d.checkins.byEmirate.map(([name, count]) => `
      <div class="bar-row">
        <div class="bar-label">
          <span class="bar-name">${name}</span>
          <span class="bar-count">${count} check-ins</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.round(count/maxCheckin*100)}%"></div>
        </div>
      </div>`).join('');

    const topCheckinRows = d.topCafesByCheckins.map((c, i) => `
      <tr>
        <td class="rank">#${i+1}</td>
        <td><div class="cafe-name">${c.name}</div><div class="cafe-area">${c.area}</div></td>
        <td><span class="count-badge">${c.count}</span></td>
      </tr>`).join('');

    const topPostRows = d.topCafesByPosts.map((c, i) => `
      <tr>
        <td class="rank">#${i+1}</td>
        <td><div class="cafe-name">${c.name}</div><div class="cafe-area">${c.area}</div></td>
        <td><span class="count-badge">${c.count}</span></td>
      </tr>`).join('');

    document.getElementById('main-content').innerHTML = `

      <!-- Users -->
      <div class="section-title">👥 Users</div>
      <div class="kpi-grid">
        <div class="kpi-card accent">
          <div class="kpi-label">Total Users</div>
          <div class="kpi-value">${d.users.total.toLocaleString()}</div>
          <div class="kpi-sub">All time</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">New Today</div>
          <div class="kpi-value">${d.users.newToday}</div>
          <div class="kpi-sub">Signed up today</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">New This Week</div>
          <div class="kpi-value">${d.users.newThisWeek}</div>
          <div class="kpi-sub">Last 7 days</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">New This Month</div>
          <div class="kpi-value">${d.users.newThisMonth}</div>
          <div class="kpi-sub">Last 30 days</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Active Users</div>
          <div class="kpi-value">${d.users.activeThisWeek}</div>
          <div class="kpi-sub">${retentionPct}% of total • 7d</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Engaged Users</div>
          <div class="kpi-value">${d.users.engaged}</div>
          <div class="kpi-sub">${engagedPct}% • 50+ BrewPoints</div>
        </div>
      </div>

      <!-- Check-ins -->
      <div class="section-title">✅ Check-ins</div>
      <div class="kpi-grid">
        <div class="kpi-card accent">
          <div class="kpi-label">Total Check-ins</div>
          <div class="kpi-value">${d.checkins.total.toLocaleString()}</div>
          <div class="kpi-sub">All time</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Today</div>
          <div class="kpi-value">${d.checkins.today}</div>
          <div class="kpi-sub">So far today</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">This Week</div>
          <div class="kpi-value">${d.checkins.thisWeek}</div>
          <div class="kpi-sub">Last 7 days</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Avg per User</div>
          <div class="kpi-value">${d.checkins.avgPerActiveUser}</div>
          <div class="kpi-sub">This week, active users</div>
        </div>
      </div>

      <!-- Community -->
      <div class="section-title">📸 Community (Vibes)</div>
      <div class="kpi-grid">
        <div class="kpi-card accent">
          <div class="kpi-label">Total Photos</div>
          <div class="kpi-value">${d.community.totalPosts.toLocaleString()}</div>
          <div class="kpi-sub">All time approved</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Posted Today</div>
          <div class="kpi-value">${d.community.postsToday}</div>
          <div class="kpi-sub">Approved today</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label"><span class="live-dot"></span>Live Now</div>
          <div class="kpi-value">${d.community.activePosts}</div>
          <div class="kpi-sub">Photos in last 2 hours</div>
        </div>
        <div class="kpi-card ${d.reports.thisWeek > 5 ? 'warn' : ''}">
          <div class="kpi-label">Reports This Week</div>
          <div class="kpi-value">${d.reports.thisWeek}</div>
          <div class="kpi-sub">${d.reports.total} total all time</div>
        </div>
      </div>

      <!-- Platform -->
      <div class="section-title">☕ Platform</div>
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Cafés in DB</div>
          <div class="kpi-value">${d.cafes.total}</div>
          <div class="kpi-sub">Across 7 emirates</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Check-ins / Café</div>
          <div class="kpi-value">${d.cafes.total > 0 ? Math.round(d.checkins.total / d.cafes.total * 10) / 10 : 0}</div>
          <div class="kpi-sub">All time average</div>
        </div>
      </div>

      <!-- Top Cafés + Emirate breakdown -->
      <div class="section-title">🏆 Top Cafés (Last 30 Days)</div>
      <div class="tables-grid">
        <div class="table-card">
          <div class="table-header">By Check-ins</div>
          <table>
            <thead><tr><th>#</th><th>Café</th><th>Check-ins</th></tr></thead>
            <tbody>${topCheckinRows || '<tr><td colspan="3" style="color:#999;text-align:center;padding:20px">No data yet</td></tr>'}</tbody>
          </table>
        </div>
        <div class="table-card">
          <div class="table-header">By Community Photos</div>
          <table>
            <thead><tr><th>#</th><th>Café</th><th>Photos</th></tr></thead>
            <tbody>${topPostRows || '<tr><td colspan="3" style="color:#999;text-align:center;padding:20px">No data yet</td></tr>'}</tbody>
          </table>
        </div>
      </div>

      <!-- Emirate breakdown -->
      <div class="section-title">🗺️ Check-ins by Emirate (Last 30 Days)</div>
      <div class="emirate-grid">
        <div class="bar-card">
          ${emirateBars || '<div style="color:#999;font-size:13px">No check-in data yet</div>'}
        </div>
        <div class="table-card">
          <div class="table-header">Breakdown</div>
          <table>
            <thead><tr><th>Emirate</th><th>Check-ins</th><th>Share</th></tr></thead>
            <tbody>
              ${d.checkins.byEmirate.map(([name, count]) => `
                <tr>
                  <td class="cafe-name">${name}</td>
                  <td>${count}</td>
                  <td style="color:var(--stone)">${d.checkins.thisWeek > 0 ? Math.round(count / d.checkins.thisWeek * 100) : 0}%</td>
                </tr>`).join('') || '<tr><td colspan="3" style="color:#999;text-align:center;padding:20px">No data yet</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

      <div class="last-updated">
        Generated at ${new Date(d.generatedAt).toLocaleString('en-AE', { timeZone: 'Asia/Dubai' })} (Dubai time)
      </div>
    `;
  }
</script>
</body>
</html>
