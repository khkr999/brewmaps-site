<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>BrewMaps Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--forest:#111111;--forest2:#2a2a2a;--caramel:#111111;--cream:#FFFFFF;--sand:#F4F4F2;--stone:#6b6b6b;--border:#E6E6E3;--red:#D93025;--amber:#B26A00;--lime:#DFF903;--up:#1a7f37;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--sand);color:#2a2218;min-height:100vh;}

    /* Login */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--forest);}
    .login-card{background:var(--cream);border-radius:20px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.3);}
    .login-logo{font-family:'Archivo',sans-serif;letter-spacing:-0.02em;font-size:28px;color:var(--forest);margin-bottom:6px;}
    .login-sub{font-size:13px;color:var(--stone);margin-bottom:32px;}
    .login-input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-family:'Inter',sans-serif;background:var(--sand);outline:none;transition:border-color .2s;margin-bottom:12px;}
    .login-input:focus{border-color:var(--forest);}
    .login-btn{width:100%;padding:14px;background:var(--forest);color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
    .login-btn:hover{background:var(--forest2);}
    .login-error{color:var(--red);font-size:13px;margin-top:10px;}

    /* Dashboard */
    #dashboard{display:none;}
    header{background:var(--forest);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;}
    .header-logo{font-family:'Archivo',sans-serif;letter-spacing:-0.02em;font-size:22px;color:var(--cream);}
    .header-right{display:flex;align-items:center;gap:12px;}
    .header-meta{font-size:12px;color:rgba(255,255,255,0.45);}
    .refresh-btn{background:rgba(255,255,255,0.12);border:none;color:white;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
    .refresh-btn:hover{background:rgba(255,255,255,0.22);}

    /* Filters bar */
    .filters-bar{background:var(--cream);border-bottom:1px solid var(--border);padding:10px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
    .filter-group{display:flex;align-items:center;gap:8px;}
    .filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--stone);}
    .pill{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--sand);color:var(--stone);cursor:pointer;transition:all .15s;}
    .pill:hover{border-color:var(--forest);color:var(--forest);}
    .pill.active{background:var(--forest);color:white;border-color:var(--forest);}

    main{max-width:1200px;margin:0 auto;padding:28px 24px;}
    .section-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin:32px 0 12px;}
    .section-title:first-child{margin-top:0;}

    /* KPI grid */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
    .kpi-card{background:var(--cream);border-radius:16px;padding:18px 20px;border:1px solid var(--border);transition:transform .15s;}
    .kpi-card:hover{transform:translateY(-2px);}
    .kpi-card.accent{background:var(--forest);border-color:var(--forest);}
    .kpi-card.warn{border-color:var(--red);}
    .kpi-label{font-size:11px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
    .kpi-card.accent .kpi-label{color:rgba(255,255,255,0.6);}
    .kpi-value{font-size:30px;font-weight:700;color:var(--forest);line-height:1;}
    .kpi-card.accent .kpi-value{color:white;}
    .kpi-card.warn .kpi-value{color:var(--red);}
    .kpi-sub{font-size:12px;color:var(--stone);margin-top:5px;}
    .kpi-card.accent .kpi-sub{color:rgba(255,255,255,0.5);}

    /* Tables */
    .tables-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:720px){.tables-grid{grid-template-columns:1fr;}}
    .table-card{background:var(--cream);border-radius:16px;border:1px solid var(--border);overflow:hidden;}
    .table-header{padding:14px 18px 10px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--forest);display:flex;align-items:center;justify-content:space-between;}
    .table-badge{font-size:11px;font-weight:700;background:var(--red);color:white;padding:2px 8px;border-radius:999px;}
    table{width:100%;border-collapse:collapse;}
    td,th{padding:10px 16px;font-size:13px;text-align:left;}
    th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--stone);background:var(--sand);}
    tr:not(:last-child) td{border-bottom:1px solid var(--border);}
    .rank{font-weight:700;color:var(--stone);}
    .cafe-name{font-weight:600;}
    .cafe-area{font-size:11px;color:var(--stone);}
    .count-badge{display:inline-block;background:var(--forest);color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}

    /* Moderation */
    .mod-row{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);}
    .mod-row:last-child{border-bottom:none;}
    .mod-avatar{width:36px;height:36px;border-radius:50%;background:var(--forest);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
    .mod-info{flex:1;}
    .mod-name{font-weight:700;font-size:13px;margin-bottom:2px;}
    .mod-detail{font-size:12px;color:var(--stone);}
    .mod-reason{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:4px;}
    .reason-spam{background:#fef3cd;color:#856404;}
    .reason-inappropriate{background:#fde8e8;color:#c0392b;}
    .reason-wrong_cafe{background:#e8f4f8;color:#2471a3;}
    .reason-other{background:var(--sand);color:var(--stone);}
    .mod-actions{display:flex;gap:6px;flex-shrink:0;margin-top:2px;}
    .ban-btn{padding:5px 12px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s;}
    .ban-btn:disabled{opacity:.5;cursor:default;}
    .ban-btn.red{background:var(--red);color:white;}
    .ban-btn.red:hover:not(:disabled){opacity:.85;}
    .ban-btn.grey{background:var(--border);color:var(--stone);}
    .ban-btn.grey:hover:not(:disabled){background:#d0c8be;}
    .banned-badge{font-size:11px;font-weight:700;color:var(--red);background:#fde8e8;padding:2px 8px;border-radius:999px;}
    .empty-state{padding:28px;text-align:center;color:#999;font-size:13px;}
    .mod-row.clickable{cursor:pointer;}
    .mod-row.clickable:hover{background:var(--sand);}
    .violation-list{display:none;padding:0 18px 14px 66px;}
    .violation-list.open{display:block;}
    .viol-item{font-size:12px;color:#444;padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;}
    .viol-item:last-child{border-bottom:none;}
    .viol-content{color:var(--stone);font-style:italic;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .viol-reason{font-weight:600;font-size:11px;color:var(--red);white-space:nowrap;}
    .viol-time{font-size:11px;color:var(--stone);white-space:nowrap;}
    .expand-hint{font-size:11px;color:var(--stone);margin-left:6px;}

    /* Bar chart */
    .bar-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:720px){.bar-grid{grid-template-columns:1fr;}}
    .bar-card{background:var(--cream);border-radius:16px;border:1px solid var(--border);padding:18px 20px;}
    .bar-card-title{font-size:13px;font-weight:700;color:var(--forest);margin-bottom:14px;}
    .bar-row{margin-bottom:11px;}
    .bar-row:last-child{margin-bottom:0;}
    .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
    .bar-name{font-weight:600;}
    .bar-count{color:var(--stone);}
    .bar-track{background:var(--sand);border-radius:999px;height:6px;overflow:hidden;}
    .bar-fill{height:100%;background:var(--forest);border-radius:999px;transition:width .6s ease;}

    .loading{text-align:center;padding:80px;color:var(--stone);font-size:15px;}
    .dot-pulse::after{content:'...';animation:dots 1.2s steps(4,end) infinite;}
    @keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
    .last-updated{font-size:12px;color:var(--stone);text-align:right;margin-top:28px;padding-bottom:28px;}
    .live-dot{display:inline-block;width:7px;height:7px;background:#2ecc71;border-radius:50%;margin-right:5px;animation:pulse 1.5s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* Overview (2026-11-16 revamp) */
    .fold{margin-top:28px;border-top:1px solid var(--border);padding-top:6px;}
    .fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-size:18px;font-weight:700;letter-spacing:-0.01em;padding:12px 0;}
    .fold>summary::-webkit-details-marker{display:none;}
    .fold>summary::before{content:'+';display:inline-flex;width:22px;height:22px;border-radius:6px;background:var(--sand);align-items:center;justify-content:center;font-size:15px;}
    .fold[open]>summary::before{content:'\2212';}
    .fold-note{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--stone);}
    .tag-paused{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;background:var(--lime);color:#111;padding:3px 8px;border-radius:999px;}
    .delta{font-size:12px;font-weight:700;margin-top:6px;}
    .delta.up{color:var(--up);} .delta.down{color:var(--red);} .delta.flat{color:var(--stone);}
    .kpi-card.hero{background:#111;border-color:#111;}
    .kpi-card.hero .kpi-label{color:rgba(255,255,255,.6);} .kpi-card.hero .kpi-value{color:#fff;}
    .kpi-card.hero .delta.up{color:var(--lime);} .kpi-card.hero .delta.down{color:#ff8a80;} .kpi-card.hero .delta.flat{color:rgba(255,255,255,.5);}
    .ov-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;align-items:start;}
    @media(max-width:820px){.ov-cols{grid-template-columns:1fr;}}
    .spark{display:flex;align-items:flex-end;gap:3px;height:90px;}
    .spark>div{flex:1;background:#111;border-radius:3px 3px 0 0;min-height:2px;position:relative;}
    .spark>div.zero{background:var(--border);}
    .spark-x{display:flex;justify-content:space-between;font-size:10px;color:var(--stone);margin-top:6px;}
    .funnel-row{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px;}
    .funnel-row .bar-track{height:10px;}
    .note{font-size:11px;color:var(--stone);margin-top:10px;line-height:1.5;}
    .num{text-align:right;font-variant-numeric:tabular-nums;}
    .range-input{padding:5px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;background:#fff;}
    .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sand);color:#111;}
    .chip.lime{background:var(--lime);}
    @media(max-width:600px){header{padding:0 16px;} .filters-bar{padding:10px 16px;} main{padding:20px 16px;} .funnel-row{grid-template-columns:120px 1fr 56px;} td,th{padding:8px 10px;}}
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">BrewMaps</div>
    <div class="login-sub">Admin Dashboard</div>
    <input id="secret-input" class="login-input" type="password" placeholder="Admin password" />
    <button class="login-btn" onclick="login()">Access Dashboard</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <header>
    <div class="header-logo">BrewMaps Admin</div>
    <div class="header-right">
      <div class="header-meta" id="last-fetch"></div>
      <button class="refresh-btn" onclick="loadStats()">↻ Refresh</button>
    </div>
  </header>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="filter-group">
      <span class="filter-label">Range</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center" id="pills-period">
        <button class="pill active" data-val="7" onclick="setPeriod(7)">7 days</button>
        <button class="pill" data-val="30" onclick="setPeriod(30)">30 days</button>
        <button class="pill" data-val="90" onclick="setPeriod(90)">90 days</button>
        <button class="pill" data-val="custom" onclick="toggleCustom()">Custom</button>
        <span id="custom-range" style="display:none;gap:6px;align-items:center">
          <input type="date" id="range-from" class="range-input" />
          <span class="filter-label">to</span>
          <input type="date" id="range-to" class="range-input" />
          <button class="pill" onclick="applyCustom()">Apply</button>
        </span>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Moderation</span>
      <div style="display:flex;gap:6px" id="pills-mod">
        <button class="pill active" data-val="all" onclick="setModFilter('all')">All</button>
        <button class="pill" data-val="flagged" onclick="setModFilter('flagged')">Flagged comments</button>
        <button class="pill" data-val="reports" onclick="setModFilter('reports')">Post reports</button>
        <button class="pill" data-val="banned" onclick="setModFilter('banned')">Banned</button>
      </div>
    </div>
  </div>

  <main id="main-content">
    <div class="loading"><span class="dot-pulse">Loading</span></div>
  </main>
</div>

<script>
const ENDPOINT = 'https://qgzyywxizlhtuwuaonxy.supabase.co/functions/v1/admin-stats';
let adminSecret = sessionStorage.getItem('bm_admin_secret') || '';
let rawData = null;
let period = 7;
let rangeTo = null;   // null = now
let rangeFrom = null; // null = rangeTo - period days
let modFilter = 'all';
let userSearch = '';
let failedExpanded = false;

// ── Login ─────────────────────────────────────────────────────────────────────
document.getElementById('secret-input').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

// Auto-login if session has the secret
if (adminSecret) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats();
}
async function login() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) return;
  adminSecret = val;
  sessionStorage.setItem('bm_admin_secret', val);
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  await loadStats(false, true);
}

// ── Event delegation for ban/unban buttons (avoids inline onclick CSP issues) ─
// NOTE: capture phase (third arg = true) so this fires BEFORE the
// `event.stopPropagation()` on the wrapping `.mod-actions` div would kill
// bubbling. Without capture, the stopPropagation (added to keep the row's
// toggleViolations from firing) was silently swallowing every ban click.
document.addEventListener('click', function(e) {
  const btn = e.target.closest('[data-ban-user]');
  if (!btn) return;
  const userId = btn.dataset.banUser;
  const action = btn.dataset.banAction; // 'ban' or 'unban'
  toggleBan(userId, action === 'ban');
}, true);

// ── Acquisition / Meta Ads panel REMOVED 2026-07-15 (Meta biz restriction — the
//    automated Marketing API pull was a likely trigger; check spend in Ads Manager) ──

// ── Filters ───────────────────────────────────────────────────────────────────
function setPeriod(val) {
  period = val; rangeFrom = null; rangeTo = null;
  document.getElementById('custom-range').style.display = 'none';
  document.querySelectorAll('#pills-period .pill').forEach(p => p.classList.toggle('active', p.dataset.val == val));
  loadOverview();
}
function toggleCustom() {
  const box = document.getElementById('custom-range');
  box.style.display = box.style.display === 'none' ? 'inline-flex' : 'none';
  if (!document.getElementById('range-to').value) {
    const to = new Date(); const from = new Date(to.getTime() - period * 86400000);
    document.getElementById('range-to').value = to.toISOString().slice(0, 10);
    document.getElementById('range-from').value = from.toISOString().slice(0, 10);
  }
}
function applyCustom() {
  const f = document.getElementById('range-from').value, t = document.getElementById('range-to').value;
  if (!f || !t || f > t) return;
  // Dubai days: from 00:00 of the first day to 24:00 of the last.
  rangeFrom = new Date(f + 'T00:00:00+04:00'); rangeTo = new Date(new Date(t + 'T00:00:00+04:00').getTime() + 86400000);
  period = Math.max(1, Math.round((rangeTo - rangeFrom) / 86400000));
  document.querySelectorAll('#pills-period .pill').forEach(p => p.classList.toggle('active', p.dataset.val === 'custom'));
  loadOverview();
}
function rangeQuery() {
  const to = rangeTo || new Date(); const from = rangeFrom || new Date(to.getTime() - period * 86400000);
  return 'from=' + encodeURIComponent(from.toISOString()) + '&to=' + encodeURIComponent(to.toISOString());
}
// Range change: only the overview is recomputed (?only=overview); moderation and users stay as loaded.
let ovFetching = false;
async function loadOverview() {
  if (!rawData || ovFetching) { if (!rawData) loadStats(); return; }
  ovFetching = true;
  const box = document.getElementById('overview'); if (box) box.style.opacity = '0.45';
  try {
    const res = await fetch(ENDPOINT + '?only=overview&' + rangeQuery() + '&t=' + Date.now(), { headers: { 'x-admin-secret': adminSecret }, cache: 'no-store' });
    if (res.ok) { const j = await res.json(); rawData.overview = j.overview; render(rawData); }
  } catch (e) { /* keep what is on screen */ }
  if (box) box.style.opacity = '1';
  ovFetching = false;
}
function setModFilter(val) {
  modFilter = val;
  document.querySelectorAll('#pills-mod .pill').forEach(p => p.classList.toggle('active', p.dataset.val === val));
  if (rawData) render(rawData);
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
let isFetching = false;
async function loadStats(silent = false, fromLogin = false) {
  if (isFetching) return;
  isFetching = true;
  if (!silent) document.getElementById('main-content').innerHTML = '<div class="loading"><span class="dot-pulse">Loading</span></div>';

  const maxRetries = 2;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 30000);
      const res = await fetch(ENDPOINT + '?' + rangeQuery() + '&t=' + Date.now(), {
        headers: { 'x-admin-secret': adminSecret },
        cache: 'no-store',
        signal: ctrl.signal,
      });
      clearTimeout(t);
      if (res.status === 401) {
        sessionStorage.removeItem('bm_admin_secret');
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('login-error').textContent = fromLogin
          ? 'Incorrect password.'
          : 'Session expired. Please log in again.';
        document.getElementById('secret-input').value = '';
        document.getElementById('secret-input').focus();
        isFetching = false;
        return;
      }
      rawData = await res.json();
      document.getElementById('last-fetch').textContent = 'Updated ' + new Date().toLocaleTimeString();
      render(rawData);
      isFetching = false;
      return;
    } catch(e) {
      if (attempt < maxRetries) {
        if (!silent) document.getElementById('main-content').innerHTML = '<div class="loading"><span class="dot-pulse">Retrying</span></div>';
        await new Promise(r => setTimeout(r, 1500));
        continue;
      }
      if (!silent) document.getElementById('main-content').innerHTML = '<div class="loading" style="color:#e74c3c">Failed to load: ' + e.message + ' <button class="refresh-btn" onclick="loadStats()" style="margin-left:12px;background:var(--forest);color:white;padding:8px 16px;">Try Again</button></div>';
    }
  }
  isFetching = false;
}

// ── Ban / Unban ───────────────────────────────────────────────────────────────
async function toggleBan(userId, ban) {
  const btn = document.getElementById('ban-btn-' + userId);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  try {
    if (!adminSecret) {
      showBanError('Not logged in — adminSecret is empty. Please refresh and log in again.');
      if (btn) { btn.disabled = false; btn.textContent = ban ? 'Ban' : 'Unban'; }
      return;
    }
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {
        'x-admin-secret': adminSecret,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ action: ban ? 'ban' : 'unban', userId }),
      signal: controller.signal,
    });
    clearTimeout(timeout);

    const result = await res.json();

    if (!result.ok) {
      showBanError('Server error: ' + (result.error ?? JSON.stringify(result)));
      if (btn) { btn.disabled = false; btn.textContent = ban ? 'Ban' : 'Unban'; }
      return;
    }

    // Optimistically update rawData so the UI reflects change immediately
    if (rawData) {
      for (const f of (rawData.flaggedUsers ?? [])) {
        if (f.user_id === userId) {
          if (!f.profiles) f.profiles = {};
          f.profiles.is_banned = ban;
        }
      }
      for (const u of (rawData.bannedUsers ?? [])) {
        if (u.id === userId) u.is_banned = ban;
      }
      if (!ban) {
        rawData.bannedUsers = (rawData.bannedUsers ?? []).filter(u => u.id !== userId);
      }
    }

    // Reload fresh data from server (silent = no loading spinner flash)
    await loadStats(true);

  } catch (err) {
    showBanError('Exception: ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = ban ? 'Ban' : 'Unban'; }
  }
}

function toggleViolations(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function showBanError(msg) {
  let el = document.getElementById('ban-error-bar');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ban-error-bar';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e74c3c;color:white;padding:12px 24px;font-size:14px;font-weight:600;z-index:9999;cursor:pointer;';
    el.onclick = () => el.remove();
    document.body.appendChild(el);
  }
  el.textContent = '⚠ ' + msg + '  (click to dismiss)';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n) { return (n??0).toLocaleString(); }
function timeAgo(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}
function initial(username) { return (username||'?')[0].toUpperCase(); }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toggleFailedPhotos() {
  failedExpanded = !failedExpanded;
  if (rawData) render(rawData);
}
function setUserSearch(v) {
  userSearch = v;
  if (rawData) render(rawData);
  // Re-focus the input after re-render (innerHTML wipes it).
  requestAnimationFrame(() => {
    const inp = document.getElementById('user-search-input');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  });
}

const SCREEN_NAMES = { DiscoveryHome: 'Discover', MapHome: 'Map', LiveHome: 'Vibes', VibesFeed: 'Vibes feed', AskHome: 'Chat',
  AskBrewMaps: 'Chat (conversation)', Messages: 'Messages', Conversation: 'Message thread', ProfileHome: 'You', MyProfile: 'You (profile)',
  CafeProfile: 'Café page', SavedHome: 'Saved', Library: 'Saved lists', UserProfile: 'Someone’s profile', AreaCafes: 'Area list',
  AreaGuide: 'Area guide', MallCafes: 'Mall list', BrewPoints: 'BrewPoints', Notifications: 'Activity', Settings: 'Settings',
  ProfileSetup: 'Sign-up: name + quiz', SignIn: 'Sign-in', SignUp: 'Sign-up', CodeSignIn: 'Code sign-in', PhoneAuth: 'Phone sign-in',
  EditUsername: 'Edit username', VibePost: 'Vibe post', FollowersList: 'Followers', FollowingList: 'Following', Friends: 'Friends' };
const TAB_ORDER = [['DiscoveryHome', 'Discover'], ['MapHome', 'Map'], ['LiveHome', 'Vibes'], ['AskHome', 'Chat'], ['Messages', 'Messages'], ['ProfileHome', 'You']];
function pct(a, b) { return b ? Math.round(a / b * 1000) / 10 : 0; }
function secs(n) { if (n == null) return '–'; return n < 90 ? n + ' s' : Math.round(n / 6) / 10 + ' min'; }
function delta(cur, prev) {
  if (!prev && !cur) return '<div class="delta flat">no change</div>';
  if (cur === prev) return '<div class="delta flat">same as before</div>';
  const dir = cur > prev ? 'up' : 'down', arrow = cur > prev ? '▲' : '▼';
  // A percentage off a tiny base says nothing (303 cafés vs 1 read "▲ 30200%"): below 10, show the two numbers.
  if (prev < 10) return `<div class="delta ${dir}">${arrow} ${cur > prev ? 'up' : 'down'} from ${fmt(prev)}</div>`;
  const d = Math.round((cur - prev) / prev * 100);
  if (d === 0) return '<div class="delta flat">about the same</div>';
  return `<div class="delta ${dir}">${arrow} ${Math.abs(d)}% vs ${fmt(prev)}</div>`;
}
function kpi(label, k, sub, hero) {
  return `<div class="kpi-card${hero ? ' hero' : ''}"><div class="kpi-label">${label}</div><div class="kpi-value">${fmt(k?.cur ?? k)}</div>${k && k.cur != null ? delta(k.cur, k.prev) : ''}${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}
function spark(daily, key, label, peak) {
  const max = Math.max(1, ...daily.map(x => x[key] || 0));
  // People per day can't be added up (the same person is in many days): show the busiest day instead.
  const total = peak ? max : daily.reduce((a, x) => a + (x[key] || 0), 0);
  const bars = daily.map(x => `<div class="${x[key] ? '' : 'zero'}" style="height:${Math.max(2, Math.round((x[key] || 0) / max * 100))}%" title="${x.d}: ${x[key] || 0}"></div>`).join('');
  const first = daily[0]?.d?.slice(5) ?? '', last = daily[daily.length - 1]?.d?.slice(5) ?? '';
  return `<div class="bar-card"><div class="bar-card-title">${label} <span class="chip">${peak ? 'busiest day ' : ''}${fmt(total)}</span></div><div class="spark">${bars}</div><div class="spark-x"><span>${first}</span><span>${last}</span></div></div>`;
}
function tableCard(title, head, rows, empty) {
  return `<div class="table-card"><div class="table-header">${title}</div><table><thead><tr>${head.map(h => `<th${h.num ? ' class="num"' : ''}>${h.t ?? h}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${head.length}" class="empty-state">${empty || 'Nothing in this range'}</td></tr>`}</tbody></table></div>`;
}
function fold(title, body, open, note) {
  return `<details class="fold"${open ? ' open' : ''}><summary>${title}${note ? ` <span class="fold-note">${note}</span>` : ''}</summary>${body}</details>`;
}

function render(d) {
  const retPct = d.users.total > 0 ? Math.round(d.users.activeThisWeek/d.users.total*100) : 0;
  const engPct = d.users.total > 0 ? Math.round(d.users.engaged/d.users.total*100) : 0;

  // Top cafés
  const topCheckinRows = d.topCafesByCheckins.map((c,i) => `
    <tr><td class="rank">#${i+1}</td>
    <td><div class="cafe-name">${escapeHtml(c.name)}</div><div class="cafe-area">${escapeHtml(c.area)}</div></td>
    <td><span class="count-badge">${c.count}</span></td></tr>`).join('') ||
    '<tr><td colspan="3" class="empty-state">No data yet</td></tr>';

  const topPostRows = d.topCafesByPosts.map((c,i) => `
    <tr><td class="rank">#${i+1}</td>
    <td><div class="cafe-name">${escapeHtml(c.name)}</div><div class="cafe-area">${escapeHtml(c.area)}</div></td>
    <td><span class="count-badge">${c.count}</span></td></tr>`).join('') ||
    '<tr><td colspan="3" class="empty-state">No data yet</td></tr>';

  // Emirate bars
  const maxEm = d.checkins.byEmirate[0]?.[1] || 1;
  const emirateBars = d.checkins.byEmirate.map(([name, count]) => `
    <div class="bar-row">
      <div class="bar-label"><span class="bar-name">${escapeHtml(name)}</span><span class="bar-count">${count}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxEm*100)}%"></div></div>
    </div>`).join('') || '<div style="color:#999;font-size:13px">No data yet</div>';

  // ── Moderation sections ────────────────────────────────────────────────────
  const flagged = d.flaggedUsers ?? [];
  const reports = d.postReports ?? [];
  const banned  = d.bannedUsers ?? [];

  // Aggregate flagged by user
  const userMap = {};
  for (const f of flagged) {
    const uid = f.user_id;
    if (!userMap[uid]) userMap[uid] = { ...f.profiles, id: uid, flags: [], count: 0 };
    userMap[uid].flags.push(f);
    userMap[uid].count++;
  }
  const flaggedList = Object.values(userMap).sort((a,b) => b.count - a.count);

  const flaggedRows = flaggedList.length ? flaggedList.map(u => {
    const violItems = u.flags.map(f => `
      <div class="viol-item">
        <span class="viol-content">"${escapeHtml((f.content ?? '').slice(0, 80))}"</span>
        <span class="viol-reason">${escapeHtml(f.reason ?? 'unknown')}</span>
        <span class="viol-time">${timeAgo(f.created_at)}</span>
      </div>`).join('');
    return `
    <div class="mod-row clickable" onclick="toggleViolations('viol-${u.id}')">
      <div class="mod-avatar">${initial(u.username)}</div>
      <div class="mod-info">
        <div class="mod-name">@${escapeHtml(u.username ?? 'unknown')}<span class="expand-hint">▸ click for details</span></div>
        <div class="mod-detail">${u.count} violation${u.count>1?'s':''} · Last: ${timeAgo(u.flags[0].created_at)}</div>
        <span class="mod-reason reason-${u.flags[0].reason?.split(' ')[0] ?? 'other'}">${u.flags[0].reason ?? 'unknown'}</span>
        ${u.is_banned ? '<span class="banned-badge" style="margin-left:6px">BANNED</span>' : ''}
      </div>
      <div class="mod-actions" onclick="event.stopPropagation()">
        ${u.is_banned
          ? `<button id="ban-btn-${u.id}" class="ban-btn grey" data-ban-user="${u.id}" data-ban-action="unban">Unban</button>`
          : `<button id="ban-btn-${u.id}" class="ban-btn red" data-ban-user="${u.id}" data-ban-action="ban">Ban</button>`}
      </div>
    </div>
    <div class="violation-list" id="viol-${u.id}">${violItems}</div>`;
  }).join('')
    : '<div class="empty-state">No flagged users 🎉</div>';

  const reportRows = reports.length ? reports.map(r => `
    <div class="mod-row">
      <div class="mod-info">
        <div class="mod-name">${escapeHtml(r.post?.cafes?.name ?? 'Unknown café')}</div>
        <div class="mod-detail">Reported by @${escapeHtml(r.reporter?.username ?? '?')} · ${timeAgo(r.created_at)}</div>
        <span class="mod-reason reason-${escapeHtml(String(r.reason ?? '').replace(/[^a-z_]/g, ''))}">${escapeHtml(r.reason?.replace('_',' '))}</span>
      </div>
      ${r.post?.photo_url && /^https:\/\//.test(r.post.photo_url) ? `<img src="${escapeHtml(r.post.photo_url)}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0">` : ''}
    </div>`).join('')
    : '<div class="empty-state">No post reports 🎉</div>';

  // ── All Users (searchable) ────────────────────────────────────────────────
  const allUsers = d.usersList ?? [];
  const searchLower = (userSearch ?? '').trim().toLowerCase();
  const filteredUsers = searchLower
    ? allUsers.filter(u =>
        (u.username ?? '').toLowerCase().includes(searchLower) ||
        (u.display_name ?? '').toLowerCase().includes(searchLower))
    : allUsers;
  const usersRows = filteredUsers.length ? filteredUsers.map(u => `
    <div class="mod-row">
      <div class="mod-avatar" style="${u.is_banned ? 'background:var(--red)' : ''}">${initial(u.username ?? u.display_name)}</div>
      <div class="mod-info">
        <div class="mod-name">@${escapeHtml(u.username ?? '—')}${u.display_name ? ` <span style="font-weight:400;color:var(--stone);font-size:13px">· ${escapeHtml(u.display_name)}</span>` : ''}
          ${u.is_banned ? '<span class="banned-badge" style="margin-left:6px">BANNED</span>' : ''}
        </div>
        <div class="mod-detail">${u.brew_points ?? 0} pts · ${u.violation_count ?? 0} violations · Joined ${timeAgo(u.created_at)}</div>
      </div>
      <div class="mod-actions">
        ${u.is_banned
          ? `<button id="ban-btn-${u.user_id}" class="ban-btn grey" data-ban-user="${u.user_id}" data-ban-action="unban">Unban</button>`
          : `<button id="ban-btn-${u.user_id}" class="ban-btn red" data-ban-user="${u.user_id}" data-ban-action="ban">Ban</button>`}
      </div>
    </div>`).join('')
    : `<div class="empty-state">${searchLower ? 'No users match "' + escapeHtml(userSearch) + '"' : 'No users yet'}</div>`;

  const bannedRows = banned.length ? banned.map(u => `
    <div class="mod-row">
      <div class="mod-avatar" style="background:var(--red)">${initial(u.username)}</div>
      <div class="mod-info">
        <div class="mod-name">@${escapeHtml(u.username ?? 'unknown')}</div>
        <div class="mod-detail">Banned ${timeAgo(u.banned_at)} · ${u.violation_count ?? 0} violations</div>
      </div>
      <div class="mod-actions">
        <button id="ban-btn-${u.user_id}" class="ban-btn grey" data-ban-user="${u.user_id}" data-ban-action="unban">Unban</button>
      </div>
    </div>`).join('')
    : '<div class="empty-state">No banned users</div>';

  // Which moderation section to show
  const showFlagged = modFilter === 'all' || modFilter === 'flagged';
  const showReports = modFilter === 'all' || modFilter === 'reports';
  const showBanned  = modFilter === 'all' || modFilter === 'banned';

  // ── Product analytics (from get_analytics_summary RPC via admin-stats) ──────
  const A   = d.analytics || {};
  const hasAnalytics = !!d.analytics;
  const act = A.active || { dau: 0, wau: 0, mau: 0 };
  const fn  = A.funnel || {};
  const ret = A.retention || { d1_rate: 0, d1_cohort: 0, d7_rate: 0, d7_cohort: 0 };
  const e7  = A.events_7d || {};
  const dauArr = A.dau || [];
  const maxDau = Math.max(1, ...dauArr.map(x => x.users || 0));
  const dauBars = dauArr.map(x => {
    const h = Math.max(4, Math.round((x.users / maxDau) * 100));
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:9px;color:var(--stone);height:12px">${x.users || ''}</div>
      <div style="width:100%;height:64px;background:var(--sand);border-radius:4px;display:flex;align-items:flex-end">
        <div style="width:100%;height:${h}%;background:var(--forest);border-radius:4px"></div>
      </div>
      <div style="font-size:8px;color:var(--stone)">${(x.date || '').slice(5)}</div>
    </div>`;
  }).join('');
  // Onboarding is the TRUE top of the funnel — it fires pre-auth, once per
  // install, so it counts everyone who finished the intro whether or not they
  // ever made an account. It is therefore larger than every step below it and
  // has to come first, or its bar renders above the step before it.
  // The 'App opens' step was REMOVED: it counted distinct signed-in users over
  // 30 days, which is the same number already shown as ACTIVE 30D / MAU in the
  // cards above, and it duplicated 'Signed in' to within a rounding of one.
  // The gap that matters is the first one — onboarding → signed in.
  const fnSteps = [
    ['🎬 Onboarding done', fn.onboarding_completed || 0],
    ['🔑 Signed in', fn.signed_in || 0],
    ['✅ Checked in', fn.checkin_created || 0],
    ['👥 Followed someone', fn.follow || 0],
  ];
  const fnMax = Math.max(1, ...fnSteps.map(s => s[1]));
  const funnelRows = fnSteps.map(([label, val]) => `
    <div class="bar-row">
      <div class="bar-label"><span class="bar-name">${label}</span><span class="bar-count">${val}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(val / fnMax * 100)}%"></div></div>
    </div>`).join('');
  const events7Total = Object.values(e7).reduce((s, n) => s + (n || 0), 0);
  const topSearchRows = (A.top_searches || []).map((s, i) => {
    const users = (s.users || []).filter(Boolean);
    const who = users.slice(0, 3).join(', ') + (users.length > 3 ? ` +${users.length - 3} more` : '');
    let when = '';
    if (s.last_at) {
      when = new Date(s.last_at).toLocaleString('en-AE', {
        timeZone: 'Asia/Dubai', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
      });
      if (s.n > 1) when = 'last ' + when;
    }
    const meta = [who ? '👤 ' + who : '', when ? '🕐 ' + when : ''].filter(Boolean).join(' · ');
    return `
    <tr><td class="rank">#${i + 1}</td><td>${(s.q || '').replace(/</g, '&lt;')}${meta ? `<div style="font-size:11px;color:var(--stone);margin-top:2px">${meta.replace(/</g, '&lt;')}</div>` : ''}</td><td><span class="count-badge">${s.n}</span></td></tr>`;
  }).join('')
    || '<tr><td colspan="3" class="empty-state">No searches yet</td></tr>';
  const ctr = A.ctr || {};
  const ctrLabel = (k) => k === 'discovery_search' ? 'Search results' : k === 'discovery_browse' ? 'Browse / filters' : k;
  const ctrCards = Object.entries(ctr).map(([ctx, v]) => `
    <div class="kpi-card"><div class="kpi-label">${ctrLabel(ctx)} CTR</div><div class="kpi-value">${v.ctr}%</div><div class="kpi-sub">${v.taps} taps / ${v.impressions} seen</div></div>`).join('')
    || '<div class="kpi-card"><div class="kpi-label">Card CTR</div><div class="kpi-value">—</div><div class="kpi-sub">no data yet</div></div>';

  // Acquisition / Meta Ads panel removed 2026-07-15 (see note above).

  // ── Push anchors: morning daily pick (9am) vs tonight's spot (8pm) ─────────
  // Real users only. delivered % = sent ÷ current push-on users; open % from
  // push_opened taps (per-type attribution starts 24 Jul — dispatcher payload fix).
  const PA = d.pushAnchors || null;
  const paCard = (key, label, icon) => {
    const a = (PA && PA.anchors && PA.anchors[key]) || null;
    if (!a) return '';
    const days = a.days || [];                    // newest first from the RPC
    const today = days[0] || { sent: 0, opened: 0 };
    const eligible = PA.eligible_now || 0;
    // Both anchors are WEEKLY (daily_pick Tue, tonight_spot Sat), so "today" is
    // 0 on six days out of seven and the card read as broken. Show the last day
    // that actually sent, and say which day that was.
    const lastRun = days.find(x => (x.sent || 0) > 0) || null;
    const shown = lastRun || today;
    const runLabel = !lastRun
      ? 'no send in 7 days'
      : (lastRun.d === today.d
          ? `delivered today · ${shown.sent}/${eligible}`
          : `delivered ${new Date(lastRun.d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} · ${shown.sent}/${eligible}`);
    const covPct = eligible > 0 ? Math.round((shown.sent / eligible) * 100) : 0;
    const openPct = a.sent_7d > 0 ? Math.round((a.opened_7d / a.sent_7d) * 100) : 0;
    const dayCells = days.slice().reverse().map(x => {
      const cov = eligible > 0 ? Math.round((x.sent / eligible) * 100) : 0;
      return `<div style="flex:1;text-align:center">
        <div style="font-size:9px;color:var(--stone)">${(x.d || '').slice(5)}</div>
        <div style="font-size:13px;font-weight:700">${x.sent}</div>
        <div style="font-size:9px;color:var(--stone)">${cov}%</div>
      </div>`;
    }).join('');
    return `
      <div class="table-card" style="padding:14px 16px;flex:1;min-width:260px">
        <div style="font-weight:700;margin-bottom:8px">${icon} ${label}</div>
        <div style="display:flex;gap:18px;margin-bottom:10px">
          <div><div class="kpi-value" style="font-size:22px">${covPct}%</div>
            <div style="font-size:10px;color:var(--stone)">${runLabel}</div></div>
          <div><div class="kpi-value" style="font-size:22px">${openPct}%</div>
            <div style="font-size:10px;color:var(--stone)">open rate 7d · ${a.opened_7d}/${a.sent_7d}</div></div>
        </div>
        <div style="display:flex;gap:2px">${dayCells}</div>
      </div>`;
  };
  // Duplication tripwire: dispatch dups = a queue row POSTed to Expo >1 time
  // (the July-23 flood class); anchor doubles = a real user got the same anchor
  // twice in one Dubai day. Both should ALWAYS be zero.
  const paDup = (PA && PA.dup) || { dispatch_dups_7d: 0, anchor_doubles_7d: 0 };
  const paDupBad = (paDup.dispatch_dups_7d > 0 || paDup.anchor_doubles_7d > 0);
  const paDupBanner = paDupBad ? `
    <div style="background:#FDE8E8;border:1.5px solid #E02424;color:#9B1C1C;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:700">
      🚨 DUPLICATE PUSH DETECTED (7d): ${paDup.dispatch_dups_7d} notification(s) sent more than once,
      ${paDup.anchor_doubles_7d} user(s) got a double anchor push. Do NOT run bulk sends until diagnosed.
    </div>` : '';
  const pushAnchorsHtml = PA ? `
    <div class="section-title">📬 Push Anchors · delivery &amp; opens</div>
    ${paDupBanner}
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      ${paCard('daily_pick', 'Morning · Daily Pick (9am)', '☀️')}
      ${paCard('tonight_spot', 'Night · Tonight’s Spot (8pm)', '🌙')}
    </div>
    <div style="font-size:11px;color:var(--stone);margin:6px 2px 14px">
      Real users only · delivered % = sent &divide; current push-on users (${PA.eligible_now || 0})
      · night anchor first ran 24 Jul · open tracking starts 24 Jul
      ${paDupBad ? '' : '· ✓ no duplicate sends detected (7d)'}
    </div>` : '';

  // ── Notifications health (get_notification_health, migration 180) ─────────
  // "opened" here is push_opened — an actual TAP — not notification_queue.is_read,
  // which only means it was seen in the in-app list. "pushed" counts only rows
  // with send_attempts >= 1; friend_checkin is in-app only since 119 and never
  // leaves the server, so counting it would understate every rate.
  const NH = d.notifications || null;
  const nhPushed = NH ? NH.byType.reduce((a, b) => a + b.pushed, 0) : 0;
  const nhOpened = NH ? NH.byType.reduce((a, b) => a + b.opened, 0) : 0;
  const nhRate   = nhPushed ? Math.round(nhOpened / nhPushed * 1000) / 10 : 0;
  const nhBreach = NH ? (NH.caps.overWeekly + NH.caps.overDaily) : 0;
  const nhUnreach = NH ? (NH.reach.realUsers - NH.reach.withToken) : 0;
  const nhBars = NH ? NH.byType.map(b => `
    <div class="bar-row">
      <div class="bar-label">
        <span class="bar-name">${b.type}</span>
        <span class="bar-count">${b.opened}/${b.pushed} · ${b.rate ?? 0}%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.min(100, Math.round((b.rate ?? 0) * 2.5))}%${(b.rate ?? 0) < 3 ? ';background:#e74c3c' : ''}"></div>
      </div>
    </div>`).join('') : '';
  const nhJobs = NH ? NH.jobs.map(j =>
    `<span class="count-badge" style="${j.active ? '' : 'background:#eee;color:#999;text-decoration:line-through'}">${j.name.replace('enqueue-', '')}</span>`).join(' ') : '';
  const nhRecent = NH ? NH.recent.map(r => `
    <tr>
      <td><div class="cafe-name">${escapeHtml(r.who)}</div><div class="cafe-area">${escapeHtml(r.type)}</div></td>
      <td><div class="cafe-area">${(r.title || '').replace(/</g, '&lt;')}</div></td>
      <td style="white-space:nowrap;font-size:11px;color:var(--stone)">${new Date(r.sent_at).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</td>
      <td>${r.is_read ? '<span class="count-badge">seen</span>' : ''}</td>
    </tr>`).join('') : '';

  // ── Partner notifications (get_partner_push_report, migration 184) ─────────
  // Separate from the anchors above on purpose: those are the product talking to
  // everyone, these point people at a café that pays us, so they are judged on
  // visits and not on taps. The last three columns are the ones a partner cares
  // about — and they are evidence the push was followed, not proof it caused it.
  const PP = d.partnerPushes || null;
  const ppRows = PP && (PP.campaigns || []).length ? PP.campaigns.map(c => `
    <tr>
      <td><div class="cafe-name">${(c.cafe || '').replace(/</g, '&lt;')}</div>
          <div class="cafe-area">${escapeHtml(c.campaign)}${c.area ? ' · ' + escapeHtml(c.area) : ''}</div></td>
      <td style="text-align:center">${c.sent}</td>
      <td style="text-align:center">${c.opened}${c.delivered ? ` · ${Math.round(c.opened / c.delivered * 100)}%` : ''}</td>
      <td style="text-align:center">${c.viewed}</td>
      <td style="text-align:center">${c.directions}</td>
      <td style="text-align:center"><strong>${c.checked_in}</strong></td>
      <td style="white-space:nowrap;font-size:11px;color:var(--stone)">${new Date(c.last_send).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</td>
    </tr>`).join('') : '';
  const partnerPushHtml = PP ? `
    <div class="section-title">🤝 Partner notifications · last ${PP.days} days</div>
    ${ppRows ? `<div class="table-card">
      <div class="bar-card-title" style="padding:14px 14px 0">A tap is not a visit — read the last three columns</div>
      <table><thead><tr><th>Café · campaign</th><th>Sent</th><th>Opened</th><th>Opened café</th><th>Directions</th><th>Checked in</th><th>Last send</th></tr></thead>
      <tbody>${ppRows}</tbody></table>
      <div class="cafe-area" style="padding:10px 14px 14px">
        Opened café, directions and check-ins count recipients who did that at that café within 7 days of their own push.
      </div>
    </div>` : `<div class="table-card"><div class="empty-state" style="padding:20px">No partner notifications in the last ${PP.days} days.</div></div>`}` : '';

  const notificationsHtml = NH ? `
    <div class="section-title">🔔 Notifications · last 30 days</div>
    ${nhBreach ? `<div style="background:#fdecea;border:1px solid #e74c3c;color:#a3271f;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:12px">
      🚨 ${nhBreach} user(s) OVER the cap — worst ${NH.caps.worstWeek}/week, ${NH.caps.worstDay}/day. Caps are 2/week scheduled and 4/day.
    </div>` : ''}
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Pushed</div><div class="kpi-value">${nhPushed.toLocaleString()}</div>
        <div class="kpi-sub">actually left the server</div>
      </div>
      <div class="kpi-card accent">
        <div class="kpi-label">Open Rate</div><div class="kpi-value">${nhRate}%</div>
        <div class="kpi-sub">${nhOpened} taps</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Reachable</div><div class="kpi-value">${NH.reach.withToken}</div>
        <div class="kpi-sub">${nhUnreach} of ${NH.reach.realUsers} have no push token</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Over The Cap</div>
        <div class="kpi-value" style="${nhBreach ? 'color:#e74c3c' : ''}">${nhBreach}</div>
        <div class="kpi-sub">worst ${NH.caps.worstWeek}/wk · ${NH.caps.worstDay}/day</div>
      </div>
    </div>
    <div class="bar-card" style="margin-top:12px">
      <div class="bar-card-title">Open rate by type — red is under 3%</div>
      ${nhBars}
    </div>
    <div class="bar-card" style="margin-top:12px">
      <div class="bar-card-title">Jobs — struck through is switched off</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${nhJobs}</div>
    </div>
    <div class="bar-card" style="margin-top:12px">
      <div class="bar-card-title">Last 20 sent</div>
      <table style="width:100%"><tbody>${nhRecent}</tbody></table>
    </div>` : '';

  document.getElementById('main-content').innerHTML = `
    ${overviewHtml(d.overview)}

    ${fold('Notifications <span class="tag-paused">paused until December</span>', pushAnchorsHtml + notificationsHtml + partnerPushHtml, false)}

    <details class="fold"><summary>Older panels <span class="fold-note">activity, retention, users, check-ins, Vibes (fixed ranges)</span></summary>
    <div class="section-title">📈 Product Analytics</div>
    ${hasAnalytics ? `
    <div class="kpi-grid">
      <div class="kpi-card accent"><div class="kpi-label">Active Today</div><div class="kpi-value">${act.dau}</div><div class="kpi-sub">DAU</div></div>
      <div class="kpi-card"><div class="kpi-label">Active 7d</div><div class="kpi-value">${act.wau}</div><div class="kpi-sub">WAU</div></div>
      <div class="kpi-card"><div class="kpi-label">Active 30d</div><div class="kpi-value">${act.mau}</div><div class="kpi-sub">MAU</div></div>
      <div class="kpi-card"><div class="kpi-label">Day-1 Retention</div><div class="kpi-value">${ret.d1_rate}%</div><div class="kpi-sub">${ret.d1_cohort} new users</div></div>
      <div class="kpi-card"><div class="kpi-label">Day-7 Retention</div><div class="kpi-value">${ret.d7_rate}%</div><div class="kpi-sub">${ret.d7_cohort} new users</div></div>
      <div class="kpi-card"><div class="kpi-label">Events 7d</div><div class="kpi-value">${fmt(events7Total)}</div><div class="kpi-sub">${fmt(A.total_events || 0)} since launch</div></div>
    </div>

    <div class="section-title">📊 Daily Active Users · 14 days</div>
    <div class="table-card" style="display:flex;gap:4px;align-items:flex-end;padding:16px">${dauBars}</div>

    <div class="section-title">🫗 Activation Funnel · 30 days</div>
    <div class="table-card" style="padding:16px 18px">${funnelRows}</div>

    <div class="section-title">👆 Card Click-Through · 30 days</div>
    <div class="kpi-grid">${ctrCards}</div>

    <div class="section-title">🔎 Top Searches · 30 days</div>
    <div class="table-card">
      <table><thead><tr><th>#</th><th>Query</th><th>Count</th></tr></thead><tbody>${topSearchRows}</tbody></table>
    </div>
    ` : `<div class="table-card"><div class="empty-state" style="padding:20px">Analytics populate once testers update to the latest build and start using the app. Check back in a day or two.</div></div>`}


    <div class="section-title">👥 Users · Last ${period} days</div>
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label">Total Users</div>
        <div class="kpi-value">${fmt(d.users.total)}</div>
        <div class="kpi-sub">Since launch · real users</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">New Today</div>
        <div class="kpi-value">${d.users.newToday}</div>
        <div class="kpi-sub">Signed up today</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">New This Week</div>
        <div class="kpi-value">${d.users.newThisWeek}</div>
        <div class="kpi-sub">Last 7 days</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">New This Month</div>
        <div class="kpi-value">${d.users.newThisMonth}</div>
        <div class="kpi-sub">Last 30 days</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Active (7d)</div>
        <div class="kpi-value">${d.users.activeThisWeek}</div>
        <div class="kpi-sub">${retPct}% of users opened the app</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Engaged</div>
        <div class="kpi-value">${d.users.engaged}</div>
        <div class="kpi-sub">${engPct}% · 50+ points</div>
      </div>
    </div>

    <div class="section-title">✅ Check-ins</div>
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label">Total</div>
        <div class="kpi-value">${fmt(d.checkins.total)}</div>
        <div class="kpi-sub">Since launch · real users</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Today</div>
        <div class="kpi-value">${d.checkins.today}</div>
        <div class="kpi-sub">So far</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">This Week</div>
        <div class="kpi-value">${d.checkins.thisWeek}</div>
        <div class="kpi-sub">Last 7 days</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg / Active User</div>
        <div class="kpi-value">${d.checkins.avgPerActiveUser}</div>
        <div class="kpi-sub">This week</div>
      </div>
    </div>

    <div class="section-title">📸 Vibes (Community)</div>
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label">Total Photos</div>
        <div class="kpi-value">${fmt(d.community.totalPosts)}</div>
        <div class="kpi-sub">Since launch · approved</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Posted Today</div>
        <div class="kpi-value">${d.community.postsToday}</div>
        <div class="kpi-sub">Approved</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label"><span class="live-dot"></span>Live Now</div>
        <div class="kpi-value">${d.community.activePosts}</div>
        <div class="kpi-sub">Last 2 hours</div>
      </div>
      <div class="kpi-card ${(d.reports.thisWeek??0) > 5 ? 'warn' : ''}">
        <div class="kpi-label">Post Reports</div>
        <div class="kpi-value">${d.reports.thisWeek}</div>
        <div class="kpi-sub">This week · ${d.reports.total} total</div>
      </div>
      <div class="kpi-card ${(banned.length) > 0 ? 'warn' : ''}">
        <div class="kpi-label">Banned Users</div>
        <div class="kpi-value">${banned.length}</div>
        <div class="kpi-sub">Active bans</div>
      </div>
      <div
        class="kpi-card ${(d.failedPhotos?.count ?? 0) > 0 ? 'warn' : ''}"
        onclick="toggleFailedPhotos()"
        style="cursor:pointer;user-select:none"
        title="Click to see top rejection reasons"
      >
        <div class="kpi-label">Failed Photos <span style="font-size:11px;opacity:.6">${failedExpanded ? '▾' : '▸'}</span></div>
        <div class="kpi-value">${d.failedPhotos?.count ?? 0}</div>
        <div class="kpi-sub">Rejected by moderation</div>
      </div>
    </div>

    ${failedExpanded ? `
    <div class="table-card" style="margin-top:-4px;padding:14px 16px">
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--stone);margin-bottom:10px">TOP REJECTION REASONS</div>
      ${(d.failedPhotos?.topReasons ?? []).length
        ? (d.failedPhotos.topReasons).map((r, i) => `
          <div style="display:flex;align-items:center;gap:12px;padding:9px 0;${i > 0 ? 'border-top:1px solid var(--border)' : ''}">
            <div style="font-weight:800;color:var(--forest);min-width:24px">#${i + 1}</div>
            <div style="flex:1;font-size:14px;line-height:1.35">${escapeHtml(r.reason)}</div>
            <div style="font-weight:700;color:var(--stone);font-size:13px;white-space:nowrap">${r.count}×</div>
          </div>`).join('')
        : '<div class="empty-state" style="padding:10px 0">No photo rejections recorded yet</div>'}
    </div>` : ''}

    <div class="section-title">📊 Engagement Rates</div>
    <div class="kpi-grid">
      <div class="kpi-card accent">
        <div class="kpi-label">Check-in Rate</div>
        <div class="kpi-value">${d.engagement?.checkinRate ?? 0}%</div>
        <div class="kpi-sub">Active users / total users</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg Check-ins / User</div>
        <div class="kpi-value">${d.engagement?.avgCheckinsPerUser ?? 0}</div>
        <div class="kpi-sub">Since launch · real users</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Community Rate</div>
        <div class="kpi-value">${d.engagement?.communityRate ?? 0}</div>
        <div class="kpi-sub">Actions / active user</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg Saves / User</div>
        <div class="kpi-value">${d.engagement?.saveRate ?? 0}</div>
        <div class="kpi-sub">Since launch · real users</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Likes</div>
        <div class="kpi-value">${fmt(d.community.totalLikes ?? 0)}</div>
        <div class="kpi-sub">Since launch · real users</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Comments</div>
        <div class="kpi-value">${fmt(d.community.totalComments ?? 0)}</div>
        <div class="kpi-sub">Since launch · real users</div>
      </div>
    </div>

    <div class="section-title">☕ Platform</div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Cafés in DB</div>
        <div class="kpi-value">${d.cafes.total}</div>
        <div class="kpi-sub">7 emirates</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Check-ins / Café</div>
        <div class="kpi-value">${d.cafes.total > 0 ? Math.round(d.checkins.total/d.cafes.total*10)/10 : 0}</div>
        <div class="kpi-sub">All time avg</div>
      </div>
    </div>

    </details>

    <details class="fold" open><summary>Moderation and users</summary>
    <!-- Moderation -->
    ${showFlagged ? `
    <div class="section-title">🚨 Flagged Users (Comment Violations)
      ${flaggedList.length ? `<span style="margin-left:8px;background:var(--red);color:white;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700">${flaggedList.length}</span>` : ''}
    </div>
    <div class="table-card">${flaggedRows}</div>` : ''}

    ${showReports ? `
    <div class="section-title">🚩 Post Reports
      ${reports.length ? `<span style="margin-left:8px;background:var(--amber);color:white;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700">${reports.length}</span>` : ''}
    </div>
    <div class="table-card">${reportRows}</div>` : ''}

    ${showBanned ? `
    <div class="section-title">🔴 Banned Users</div>
    <div class="table-card">${bannedRows}</div>` : ''}

    <!-- All Users (always visible — search to ban any user) -->
    <div class="section-title">👥 All Users
      <span style="margin-left:8px;background:var(--forest);color:white;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700">${allUsers.length}${allUsers.length >= 500 ? '+' : ''}</span>
      ${searchLower ? `<span style="margin-left:6px;font-size:13px;color:var(--stone);font-weight:400">showing ${filteredUsers.length}</span>` : ''}
    </div>
    <div style="margin-bottom:12px">
      <input
        id="user-search-input"
        type="text"
        placeholder="Search by @username or display name…"
        value="${escapeHtml(userSearch)}"
        oninput="setUserSearch(this.value)"
        style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;background:white;box-sizing:border-box"
      />
      ${allUsers.length >= 500 ? `<div style="margin-top:6px;font-size:12px;color:var(--stone)">Showing most-recent 500 users · older users not in this list yet</div>` : ''}
    </div>
    <div class="table-card">${usersRows}</div>

    </details>

    <details class="fold"><summary>Top cafés and emirates <span class="fold-note">last 30 days, check-ins and Vibes photos</span></summary>
    <!-- Top Cafés -->
    <div class="section-title">🏆 Top Cafés (Last 30 Days)</div>
    <div class="tables-grid">
      <div class="table-card">
        <div class="table-header">By Check-ins</div>
        <table><thead><tr><th>#</th><th>Café</th><th>Count</th></tr></thead>
        <tbody>${topCheckinRows}</tbody></table>
      </div>
      <div class="table-card">
        <div class="table-header">By Community Photos</div>
        <table><thead><tr><th>#</th><th>Café</th><th>Count</th></tr></thead>
        <tbody>${topPostRows}</tbody></table>
      </div>
    </div>

    <!-- Emirate -->
    <div class="section-title">🗺️ Check-ins by Emirate</div>
    <div class="bar-grid">
      <div class="bar-card">
        <div class="bar-card-title">Distribution</div>
        ${emirateBars}
      </div>
      <div class="table-card">
        <div class="table-header">Breakdown</div>
        <table><thead><tr><th>Emirate</th><th>Check-ins</th><th>Share</th></tr></thead>
        <tbody>${d.checkins.byEmirate.map(([n,c]) =>
          `<tr><td class="cafe-name">${n}</td><td>${c}</td>
          <td style="color:var(--stone)">${d.checkins.total>0?Math.round(c/d.checkins.total*100):0}%</td></tr>`
        ).join('') || '<tr><td colspan="3" class="empty-state">No data</td></tr>'}</tbody></table>
      </div>
    </div>

    </details>

    <div class="last-updated">
      Generated at ${new Date(d.generatedAt).toLocaleString('en-AE',{timeZone:'Asia/Dubai'})} (Dubai time)
    </div>
  `;
}
</script>
</body>
</html>
